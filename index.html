// domingo\n  { N:6,  diff:\"logic\" }, // segunda\n  { N:7,  diff:\"logic\" }, // terça\n  { N:7,  diff:\"logic\" }, // quarta\n  { N:8,  diff:\"logic\" }, // quinta\n  { N:9,  diff:\"any\"   }, // sexta\n  { N:10, diff:\"any\"   }, // sábado\n];\nfunction todayDateStr(){\n  const d = new Date();\n  return d.getFullYear() + \"-\" + String(d.getMonth()+1).padStart(2,\"0\") + \"-\" + String(d.getDate()).padStart(2,\"0\");\n}\nfunction todayLabel(){\n  const d = new Date();\n  return String(d.getDate()).padStart(2,\"0\") + \"/\" + String(d.getMonth()+1).padStart(2,\"0\");\n}\nfunction renderDailyCard(){\n  const d = new Date();\n  const params = DAY_PARAMS[d.getDay()];\n  $(\"dailyDate\").textContent = DAY_NAMES[d.getDay()] + \" · \" +\n    String(d.getDate()).padStart(2,\"0\") + \"/\" + String(d.getMonth()+1).padStart(2,\"0\") + \"/\" + d.getFullYear();\n  $(\"dailyMeta\").textContent =\n    `${params.N}×${params.N} suspeitos · ${params.diff === \"logic\" ? \"Detetive\" : \"Livre\"}`;\n  const already = CASE && CASE.dailyLabel === todayLabel();\n  $(\"btnDaily\").textContent = already ? \"✓ Já investigado hoje — jogar de novo\" : \"🔎 Investigar o caso de hoje\";\n  $(\"btnDaily\").classList.toggle(\"played\", already);\n}\n$(\"btnDaily\").addEventListener(\"click\", () => {\n  $(\"newModal\").classList.remove(\"open\");\n  const params = DAY_PARAMS[new Date().getDay()];\n  const seed = \"daily-\" + todayDateStr();\n  const label = todayLabel();\n  generateAsync(params.N, seed, params.diff, c => {\n    if (!c){ toast(\"Não consegui montar o caso de hoje — tente de novo em instantes.\"); return; }\n    startCase(c, label);\n  });\n});\n\n/* ============================================================\n   NOVO CASO\n============================================================ */\nfunction startCase(c, dailyLabel){\n  CASE = c;\n  CASE.dailyLabel = dailyLabel || null;\n  const N = c.scene.N;\n  marks = Array.from({length:N}, () => Array.from({length:N}, () => ({ x:false, cands:new Set(), conf:null })));\n  letters = {};\n  c.people.forEach(p => letters[p.id] = p.letra);\n  const suspects = c.people.filter(p => !p.isVictim);\n  const victim = c.people.find(p => p.isVictim);\n  tool = suspects[0].id;\n  struck = new Set(); undoStack = [];\n  stats = { t0:Date.now(), checks:0, wrongChecks:0, accusations:0 };\n  finished = false;\n  $(\"caseId\").textContent = dailyLabel ? \"📅 \" + dailyLabel : \"#\" + c.seed.toString(16);\n  clearInterval(timerInt);\n  timerInt = setInterval(tickTimer, 1000); tickTimer();\n  renderAll();\n  toast(`${c.scene.theme.titulo} — ${suspects.length} suspeitos. Boa investigação, inspetor!`);\n  if (window.__pendingAllArrested){ window.__pendingAllArrested = false; showAllArrestedLineup(); }\n}\nfunction tickTimer(){\n  const s = Math.floor((Date.now() - stats.t0) / 1000);\n  $(\"timer\").textContent = Math.floor(s/60) + \":\" + String(s%60).padStart(2,\"0\");\n}\n\n/* ============================================================\n   RENDER — tabuleiro\n============================================================ */\nfunction cellSizeFor(N){\n  const w = Math.min(window.innerWidth, 560) - 26;\n  return Math.max(28, Math.min(64, Math.floor(w / N)));\n}\n/* mobília multi-célula desenhada como UMA peça esticada */\nfunction stripSVG(key, len, horiz){\n  const W = horiz ? 64 * len : 64, H = horiz ? 64 : 64 * len;\n  const S3 = 'stroke=\"#2a2f3a\" stroke-width=\"3\" stroke-linejoin=\"round\"';\n  let inner = \"\";\n  if (key === \"cama\"){\n    // travesseiro na \"cabeceira\" (primeira célula do strip)\n    const pw = horiz ? 30 : W - 24, ph = horiz ? H - 24 : 30;\n    inner = `\n      <rect x=\"6\" y=\"6\" width=\"${W-12}\" height=\"${H-12}\" rx=\"8\" fill=\"#e8e3f5\" ${S3}/>\n      <rect x=\"11\" y=\"11\" width=\"${pw}\" height=\"${ph}\" rx=\"6\" fill=\"#ffffff\" ${S3}/>\n      ${horiz\n        ? `<path d=\"M${46} 6 h${W-52} a8 8 0 0 1 8 8 v${H-28} a8 8 0 0 1 -8 8 h-${W-52} z\" fill=\"#b9a7e0\" ${S3}/>\n           <line x1=\"${56}\" y1=\"8\" x2=\"${56}\" y2=\"${H-8}\" stroke=\"#8f7cc0\" stroke-width=\"3\"/>`\n        : `<path d=\"M6 ${46} v${H-52} a8 8 0 0 0 8 8 h${W-28} a8 8 0 0 0 8 -8 v-${H-52} z\" fill=\"#b9a7e0\" ${S3}/>\n           <line x1=\"8\" y1=\"${56}\" x2=\"${W-8}\" y2=\"${56}\" stroke=\"#8f7cc0\" stroke-width=\"3\"/>`}`;\n  } else if (key === \"tapete\"){\n    inner = `\n      <rect x=\"6\" y=\"8\" width=\"${W-12}\" height=\"${H-16}\" rx=\"7\" fill=\"#f2c9c2\" ${S3}/>\n      <rect x=\"15\" y=\"17\" width=\"${W-30}\" height=\"${H-34}\" rx=\"5\" fill=\"none\"\n        stroke=\"#c98d84\" stroke-width=\"3\" stroke-dasharray=\"6 5\"/>`;\n  } else if (key === \"mesa\"){\n    inner = `\n      <rect x=\"7\" y=\"10\" width=\"${W-14}\" height=\"${H-20}\" rx=\"6\" fill=\"#c9a06a\" ${S3}/>\n      <rect x=\"10\" y=\"13\" width=\"11\" height=\"11\" rx=\"2\" fill=\"#8a6a42\" opacity=\".35\"/>\n      <rect x=\"${W-21}\" y=\"13\" width=\"11\" height=\"11\" rx=\"2\" fill=\"#8a6a42\" opacity=\".35\"/>\n      <rect x=\"10\" y=\"${H-24}\" width=\"11\" height=\"11\" rx=\"2\" fill=\"#8a6a42\" opacity=\".35\"/>\n      <rect x=\"${W-21}\" y=\"${H-24}\" width=\"11\" height=\"11\" rx=\"2\" fill=\"#8a6a42\" opacity=\".35\"/>`;\n  }\n  return `<svg viewBox=\"0 0 ${W} ${H}\">${inner}<\u002Fsvg>`;\n}\n\nfunction renderBoard(){\n  const { scene } = CASE;\n  const N = scene.N;\n  const cs = cellSizeFor(N);\n  document.documentElement.style.setProperty(\"--cs\", cs + \"px\");\n  const g = $(\"grid\");\n  g.innerHTML = \"\";\n  g.style.gridTemplateColumns = `repeat(${N}, var(--cs))`;\n\n  const stripCells = new Set();\n  for (const st of (scene.strips || []))\n    for (const [sr,sc] of st.cells) stripCells.add(sr + \",\" + sc);\n\n  for (let r = 0; r < N; r++){\n    for (let c = 0; c < N; c++){\n      const d = document.createElement(\"div\");\n      d.className = \"cell\";\n      d.dataset.r = r; d.dataset.c = c;\n      if (scene.voidMask[r][c]){ d.classList.add(\"voidc\"); g.appendChild(d); continue; }\n      const roomId = scene.roomOf[r][c];\n      d.style.background = ROOM_COLORS[roomId % ROOM_COLORS.length];\n      const wall = (r2,c2) =>\n        r2 < 0 || r2 >= N || c2 < 0 || c2 >= N ||\n        scene.voidMask[r2][c2] || scene.roomOf[r2][c2] !== roomId;\n      const bw = \"3px solid var(--ink)\", bt = \"1px solid var(--line)\";\n      d.style.borderTop    = wall(r-1,c) ? bw : bt;\n      d.style.borderLeft   = wall(r,c-1) ? bw : bt;\n      d.style.borderBottom = wall(r+1,c) ? bw : \"none\";\n      d.style.borderRight  = wall(r,c+1) ? bw : \"none\";\n\n      const o = scene.obj[r][c];\n      if (o && o !== \"__void\" && ICONS[o] && !stripCells.has(r + \",\" + c)){\n        const sp = document.createElement(\"span\");\n        sp.className = \"obj\"; sp.innerHTML = ICONS[o];\n        d.appendChild(sp);\n      }\n      if (o && !OBJ[o].occ) d.classList.add(\"blockedc\");\n      d.addEventListener(\"click\", onCellTap);\n      d.addEventListener(\"pointerdown\", onCellPointerDown);\n      d.addEventListener(\"pointerup\", cancelLongPress);\n      d.addEventListener(\"pointerleave\", cancelLongPress);\n      d.addEventListener(\"pointercancel\", cancelLongPress);\n      g.appendChild(d);\n    }\n  }\n  // peças multi-célula (camas, tapetes, mesas) como um só desenho\n  for (const st of (scene.strips || [])){\n    const r0 = st.cells[0][0], c0 = st.cells[0][1];\n    const rl = st.cells[st.cells.length - 1];\n    const horiz = rl[1] !== c0;\n    const len = st.cells.length;\n    const piece = document.createElement(\"div\");\n    piece.className = \"stripObj\";\n    piece.style.left = 5 + c0 * cs + \"px\";\n    piece.style.top  = 5 + r0 * cs + \"px\";\n    piece.style.width  = (horiz ? len : 1) * cs + \"px\";\n    piece.style.height = (horiz ? 1 : len) * cs + \"px\";\n    piece.innerHTML = stripSVG(st.key, len, horiz);\n    g.appendChild(piece);\n  }\n  // rótulos dos cômodos\n  for (const rm of scene.rooms){\n    const lbl = document.createElement(\"div\");\n    lbl.className = \"roomlabel\";\n    lbl.textContent = rm.nome.toUpperCase();\n    const bottomRow = Math.max(...rm.cells.map(([r]) => r));\n    const rowCells = rm.cells.filter(([r]) => r === bottomRow).map(([,c]) => c).sort((a,b) => a-b);\n    const midC = rowCells[Math.floor((rowCells.length - 1) / 2)];\n    lbl.style.left = 5 + (midC + .5) * cs + \"px\";\n    lbl.style.top  = 5 + (bottomRow + 1) * cs - Math.round(cs * .3) + \"px\";\n    lbl.style.transform = \"translateX(-50%)\";\n    if (cs < 38) lbl.style.fontSize = \"7px\";\n    g.appendChild(lbl);\n  }\n  // janelas\n  for (const w of scene.windows){\n    const d = document.createElement(\"div\");\n    const horiz = (w.side === \"N\" || w.side === \"S\");\n    const len = Math.round(cs * .46), th = Math.max(7, Math.round(cs * .13));\n    d.className = \"window\";\n    d.style.width  = (horiz ? len : th) + \"px\";\n    d.style.height = (horiz ? th : len) + \"px\";\n    const x = 5 + w.c * cs, y = 5 + w.r * cs;\n    if (w.side === \"N\"){ d.style.left = x + cs/2 - len/2 + \"px\"; d.style.top = y - th/2 + \"px\"; }\n    if (w.side === \"S\"){ d.style.left = x + cs/2 - len/2 + \"px\"; d.style.top = y + cs - th/2 + \"px\"; }\n    if (w.side === \"W\"){ d.style.left = x - th/2 + \"px\"; d.style.top = y + cs/2 - len/2 + \"px\"; }\n    if (w.side === \"E\"){ d.style.left = x + cs - th/2 + \"px\"; d.style.top = y + cs/2 - len/2 + \"px\"; }\n    g.appendChild(d);\n  }\n  renderMarks();\n}\nfunction renderMarks(){\n  const N = CASE.scene.N;\n  document.querySelectorAll(\"#grid .cell\").forEach(d => {\n    d.querySelectorAll(\".mark-x,.cands,.conf\").forEach(x => x.remove());\n    const r = +d.dataset.r, c = +d.dataset.c;\n    if (CASE.scene.voidMask[r][c]) return;\n    const m = marks[r][c];\n    if (m.x){\n      const x = document.createElement(\"div\"); x.className = \"mark-x\"; x.textContent = \"✕\";\n      d.appendChild(x); return;\n    }\n    if (m.conf != null){\n      const p = CASE.people.find(q => q.id === m.conf);\n      const w = document.createElement(\"div\");\n      w.className = \"conf\" + (p.isVictim ? \" victim\" : \"\");\n      w.innerHTML = avatarOf(p) + `<span class=\"tag\">${p.isVictim ? \"✝\" : letters[m.conf]}<\u002Fspan>`;\n      d.appendChild(w); return;\n    }\n    if (m.cands.size){\n      const box = document.createElement(\"div\"); box.className = \"cands\";\n      const arr = [...m.cands];\n      arr.slice(0, 4).forEach(pid => {\n        const s = document.createElement(\"span\"); s.textContent = letters[pid]; box.appendChild(s);\n      });\n      if (arr.length > 4){\n        const s = document.createElement(\"span\"); s.textContent = \"+\" + (arr.length - 4); box.appendChild(s);\n      }\n      d.appendChild(box);\n    }\n  });\n  renderTray(); // estado \"posicionado\" dos chips\n}\nfunction chipColor(pid){\n  const suspects = CASE.people.filter(p => !p.isVictim);\n  const i = suspects.findIndex(p => p.id === pid);\n  return CHIP_COLORS[i % CHIP_COLORS.length];\n}\n\n/* ============================================================\n   RENDER — bandeja de ferramentas e pistas\n============================================================ */\nfunction renderTray(){\n  const tray = $(\"tray\");\n  tray.innerHTML = \"\";\n  const mk = (id, badgeHtml, label, cls) => {\n    const b = document.createElement(\"button\");\n    b.className = \"chip \" + cls + (tool === id ? \" sel\" : \"\");\n    b.innerHTML = `<span class=\"badge\">${badgeHtml}<\u002Fspan><span class=\"nm\">${label}<\u002Fspan>`;\n    b.addEventListener(\"click\", () => { sfx.uiClick(); tool = id; renderTray(); });\n    tray.appendChild(b);\n    return b;\n  };\n  mk(\"x\", \"✕\", \"Eliminar\", \"tool\");\n  mk(\"erase\", \"⌫\", \"Borracha\", \"tool\");\n  const confirmed = new Set();\n  for (const row of marks) for (const m of row) if (m.conf != null) confirmed.add(m.conf);\n  for (const p of CASE.people){\n    const isV = p.isVictim;\n    const badge = `<span class=\"av\">${avatarOf(p)}<\u002Fspan><span class=\"ltr\">${isV ? \"✝\" : letters[p.id]}<\u002Fspan>`;\n    const b = mk(p.id, badge, p.nome, isV ? \"victimChip\" : \"\");\n    if (confirmed.has(p.id)) b.classList.add(\"done\");\n  }\n  renderActiveInfo();\n}\n\n/* ============================================================\n   CAIXA DE CONTEXTO — mostra as pistas da pessoa selecionada,\n   ou instruções da ferramenta ativa (X / borracha)\n============================================================ */\nfunction currentToolInfo(){\n  if (tool === \"x\")\n    return { av:\"✕\", title:\"Eliminar\", cls:\"toolMode\",\n      txt:\"Toque numa célula para marcar ✕ — ninguém pode estar ali. Toque de novo para desfazer.\" };\n  if (tool === \"erase\")\n    return { av:\"⌫\", title:\"Borracha\", cls:\"toolMode\",\n      txt:\"Toque numa célula para apagar qualquer marcação nela — ✕, candidato ou confirmação.\" };\n  const p = CASE.people.find(x => x.id === tool);\n  if (!p) return { av:\"\", title:\"\", cls:\"\", txt:\"\" };\n  if (p.isVictim){\n    return { av:avatarOf(p), title:`✝ ${p.nome}`, cls:\"victimMode\",\n      txt:`A Vítima. Estava na última célula restante, sozinh${p.genero===\"F\"?\"a\":\"o\"} com o assassino.` };\n  }\n  const cls = CASE.clues.filter(c => c.pid === p.id);\n  const txt = cls.map(cl => clueText(cl, CASE.scene, CASE.people)).join(\" \");\n  return { av:avatarOf(p), title:`${letters[p.id]} · ${p.nome}`, cls:\"\", txt };\n}\nfunction renderActiveInfo(){\n  const box = $(\"activeInfo\");\n  const info = currentToolInfo();\n  box.className = info.cls || \"\";\n  const avHtml = info.av && info.av.length > 2 // é SVG (busto), não símbolo\n    ? info.av : `<span>${info.av}<\u002Fspan>`;\n  box.innerHTML =\n    `<span class=\"avSmall\">${avHtml}<\u002Fspan>\n     <div class=\"infoText\"><div class=\"infoInner\"><b>${info.title}<\u002Fb>${info.title ? \" — \" : \"\"}${info.txt}<\u002Fdiv><\u002Fdiv>`;\n  fitTextBox(box.querySelector(\".infoInner\"));\n}\n/* navegação por suspeitos + Eliminar/Borracha (usada pelo swipe do card ativo) — realca e rola o chip\n   correspondente na bandeja de ferramentas (#tray), não a lista de pistas */\nfunction suspectList(){ return [\"x\", \"erase\", ...CASE.people.filter(p => !p.isVictim).map(p => p.id)]; }\nfunction scrollChipIntoTray(){\n  const tray = $(\"tray\");\n  const chip = tray.querySelector(\".chip.sel\");\n  if (!chip) return;\n  const trayRect = tray.getBoundingClientRect(), chipRect = chip.getBoundingClientRect();\n  if (chipRect.left < trayRect.left) tray.scrollBy({ left: chipRect.left - trayRect.left - 10, behavior:\"smooth\" });\n  else if (chipRect.right > trayRect.right) tray.scrollBy({ left: chipRect.right - trayRect.right + 10, behavior:\"smooth\" });\n}\nfunction stepTool(delta){\n  const list = suspectList();\n  if (!list.length) return;\n  const idx = list.findIndex(id => id === tool);\n  const next = ((idx < 0 ? 0 : idx + delta) % list.length + list.length) % list.length;\n  sfx.uiClick();\n  tool = list[next];\n  renderTray();\n  scrollChipIntoTray();\n}\n(function initActiveInfoSwipe(){\n  const box = $(\"activeInfo\");\n  let sx = null, sy = null;\n  box.addEventListener(\"touchstart\", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });\n  box.addEventListener(\"touchend\", e => {\n    if (sx == null) return;\n    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;\n    sx = null;\n    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.3) return;\n    stepTool(dx > 0 ? -1 : 1); // direita = anterior, esquerda = próxima\n  }, { passive:true });\n})();\nfunction fitTextBox(el){\n  const parent = el.parentElement; // .infoText, altura = caixa esticada\n  let size = 14;\n  el.style.fontSize = size + \"px\";\n  while (el.scrollHeight > parent.clientHeight && size > 9.5){\n    size -= 0.5;\n    el.style.fontSize = size + \"px\";\n  }\n}\nfunction renderClues(){\n  const { scene, people, clues } = CASE;\n  const ul = $(\"clueList\");\n  ul.innerHTML = \"\";\n  const items = [];\n  for (const p of people){\n    if (p.isVictim){\n      items.push({ key:\"v\", cls:\"victim\", av:avatarOf(p), person:p, nome:p.nome,\n        txt:`A Vítima. Estava na última célula restante, sozinh${p.genero===\"F\"?\"a\":\"o\"} com o assassino.` });\n    } else {\n      const cls = clues.filter(x => x.pid === p.id);\n      items.push({ key:\"p\"+p.id, cls:\"\", av:avatarOf(p), person:p, nome:`${letters[p.id]} · ${p.nome}`, pid:p.id,\n        txt:cls.map(cl => clueText(cl, scene, people)).join(\" \") });\n    }\n  }\n  clues.filter(x => x.pid == null).forEach((g,i) =>\n    items.push({ key:\"g\"+i, cls:\"\", av:null, person:null, nome:\"Observação\", txt:clueText(g, scene, people) }));\n\n  items.forEach(it => {\n    const li = document.createElement(\"li\");\n    li.className = it.cls + (struck.has(it.key) ? \" struck\" : \"\");\n    const badge = it.person\n      ? `<button class=\"avBadge\" title=\"Ver ${it.person.nome}\">${it.av}<\u002Fbutton>`\n      : `<span class=\"badge\">📌<\u002Fspan>`;\n    li.innerHTML =\n      `${badge}<div class=\"clueBody\"><b>${it.nome}<\u002Fb> — <span class=\"txt\">${it.txt}<\u002Fspan><\u002Fdiv>\n       <button class=\"useBtn\" title=\"Marcar pista como usada\">✓<\u002Fbutton>`;\n    // retrato -> ficha da pessoa\n    if (it.person){\n      li.querySelector(\".avBadge\").addEventListener(\"click\", ev => {\n        ev.stopPropagation();\n        openPersonModal(it.person);\n      });\n    }\n    // círculo à direita -> risca/desrisca\n    li.querySelector(\".useBtn\").addEventListener(\"click\", ev => {\n      ev.stopPropagation();\n      sfx.clear();\n      struck.has(it.key) ? struck.delete(it.key) : struck.add(it.key);\n      li.classList.toggle(\"struck\");\n    });\n    // corpo da pista -> seleciona o suspeito como ferramenta\n    li.querySelector(\".clueBody\").addEventListener(\"click\", () => {\n      if (it.pid != null){ sfx.uiClick(); tool = it.pid; renderTray(); toast(`Ferramenta: ${letters[it.pid]} · ${CASE.people.find(p=>p.id===it.pid).nome}`); }\n    });\n    ul.appendChild(li);\n  });\n}\nfunction renderAll(){ renderBoard(); renderClues(); }\n\n/* ============================================================\n   INTERAÇÃO — toques nas células\n============================================================ */\nfunction pushUndo(){\n  undoStack.push(marks.map(row => row.map(m => ({ x:m.x, cands:new Set(m.cands), conf:m.conf }))));\n  if (undoStack.length > 120) undoStack.shift();\n}\nfunction eraseCell(d){\n  const r = +d.dataset.r, c = +d.dataset.c;\n  const m = marks[r][c];\n  if (!m.x && !m.cands.size && m.conf == null) return;\n  pushUndo();\n  m.x = false; m.cands.clear(); m.conf = null;\n  sfx.clear();\n  renderMarks();\n}\nlet longPressTimer = null, longPressFired = false;\nfunction onCellPointerDown(e){\n  longPressFired = false;\n  const d = e.currentTarget;\n  clearTimeout(longPressTimer);\n  longPressTimer = setTimeout(() => {\n    longPressFired = true;\n    if (navigator.vibrate) navigator.vibrate(15);\n    eraseCell(d);\n  }, 480);\n}\nfunction cancelLongPress(){ clearTimeout(longPressTimer); }\nfunction onCellTap(e){\n  if (longPressFired){ longPressFired = false; e.preventDefault(); return; }\n  if (finished) return;\n  const d = e.currentTarget;\n  const r = +d.dataset.r, c = +d.dataset.c;\n  const { scene } = CASE;\n  const o = scene.obj[r][c];\n  if (o && o !== \"__void\" && !OBJ[o].occ){\n    sfx.denied();\n    toast(`${OBJ[o].nome} não pode ser ocupad${OBJ[o].art===\"uma\"?\"a\":\"o\"}.`);\n    return;\n  }\n  const m = marks[r][c];\n  if (tool === \"x\"){\n    pushUndo();\n    m.x = !m.x;\n    if (m.x){ m.cands.clear(); m.conf = null; sfx.candidate(); }\n    else sfx.clear();\n  } else if (tool === \"erase\"){\n    if (!m.x && !m.cands.size && m.conf == null) return;\n    pushUndo();\n    m.x = false; m.cands.clear(); m.conf = null;\n    sfx.clear();\n  } else if (tool != null){\n    pushUndo();\n    const pid = tool;\n    if (m.conf === pid){                       // confirmado -> limpa\n      m.conf = null;\n      sfx.clear();\n    } else if (m.cands.has(pid)){              // candidato -> confirma (único no tabuleiro)\n      for (const row of marks) for (const mm of row) if (mm.conf === pid) mm.conf = null;\n      m.conf = pid; m.cands.delete(pid); m.x = false;\n      sfx.confirm();\n    } else {                                   // nada -> candidato\n      if (m.conf != null){ sfx.denied(); toast(\"Célula já confirmada — use a borracha.\"); undoStack.pop(); return; }\n      m.cands.add(pid); m.x = false;\n      sfx.candidate();\n    }\n  }\n  renderMarks();\n}\n$(\"btnUndo\").addEventListener(\"click\", () => {\n  if (finished){ sfx.denied(); toast(\"O caso já foi encerrado — inicie um novo caso para investigar de novo.\"); return; }\n  if (!undoStack.length){ sfx.denied(); toast(\"Nada para desfazer.\"); return; }\n  sfx.clear();\n  marks = undoStack.pop();\n  renderMarks();\n});\n\n/* ============================================================\n   VERIFICAR e ACUSAR\n============================================================ */\n$(\"btnCheck\").addEventListener(\"click\", () => {\n  if (finished) return;\n  stats.checks++;\n  let wrong = 0, right = 0, total = 0;\n  document.querySelectorAll(\"#grid .cell\").forEach(d => {\n    const r = +d.dataset.r, c = +d.dataset.c;\n    if (CASE.scene.voidMask[r][c]) return;\n    const m = marks[r][c];\n    if (m.conf == null) return;\n    total++;\n    const p = CASE.people.find(q => q.id === m.conf);\n    const okHere = p.cell[0] === r && p.cell[1] === c;\n    d.classList.remove(\"errFlash\",\"okFlash\");\n    void d.offsetWidth;\n    if (okHere){ right++; d.classList.add(\"okFlash\"); }\n    else { wrong++; d.classList.add(\"errFlash\"); }\n    setTimeout(() => d.classList.remove(\"errFlash\",\"okFlash\"), 1100);\n  });\n  stats.wrongChecks += wrong;\n  if (!total){ sfx.uiClick(); toast(\"Confirme alguém no tabuleiro primeiro (2º toque confirma).\"); }\n  else if (wrong){ sfx.checkWrong(); toast(`${wrong} posição(ões) incorreta(s) — marcadas em vermelho.`); }\n  else if (right === CASE.people.length){ sfx.checkOk(); toast(\"Todos posicionados corretamente! Hora de acusar. ⚖\"); }\n  else { sfx.checkOk(); toast(`${right} corretas até agora. Continue!`); }\n});\n\n$(\"btnAccuse\").addEventListener(\"click\", () => {\n  if (finished){ $(\"resultModal\").classList.add(\"open\"); return; }\n  const list = $(\"accuseList\");\n  list.innerHTML = \"\";\n  for (const p of CASE.people.filter(x => !x.isVictim)){\n    const b = document.createElement(\"button\");\n    b.className = \"chip\";\n    b.innerHTML = `<span class=\"badge\"><span class=\"av\">${avatarOf(p)}<\u002Fspan><span class=\"ltr\">${letters[p.id]}<\u002Fspan><\u002Fspan><span class=\"nm\">${p.nome}<\u002Fspan>`;\n    b.addEventListener(\"click\", () => accuse(p));\n    list.appendChild(b);\n  }\n  $(\"accuseModal\").classList.add(\"open\");\n});\n$(\"btnCancelAccuse\").addEventListener(\"click\", () => $(\"accuseModal\").classList.remove(\"open\"));\n\nfunction accuse(p){\n  $(\"accuseModal\").classList.remove(\"open\");\n  stats.accusations++;\n  if (p.id === CASE.killer.id){\n    finished = true;\n    clearInterval(timerInt);\n    revealSolution();\n    sfx.victory();\n    const s = Math.floor((Date.now() - stats.t0) / 1000);\n    $(\"resultEmoji\").innerHTML =\n      `<span class=\"mugshot\">${avatarOf(p)}<span class=\"bars\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan><span class=\"stamp\">${p.genero===\"F\"?\"Presa\":\"Preso\"}<\u002Fspan><\u002Fspan>`;\n    confettiBurst();\n    $(\"resultTitle\").textContent = \"Caso encerrado!\";\n    $(\"resultWho\").textContent = `${p.nome} era o assassino. Prendam-no!`;\n    if (p.genero === \"F\") $(\"resultWho\").textContent = `${p.nome} era a assassina. Prendam-na!`;\n    $(\"resultStats\").textContent =\n      `tempo: ${Math.floor(s/60)}:${String(s%60).padStart(2,\"0\")}\\n` +\n      `verificações: ${stats.checks} (${stats.wrongChecks} erros)\\n` +\n      `acusações: ${stats.accusations}\\n` +\n      `${CASE.dailyLabel ? \"📅 Caso do Dia · \" + CASE.dailyLabel : \"caso #\" + CASE.seed.toString(16)} · ${CASE.scene.theme.titulo} · ${CASE.scene.N}×${CASE.scene.N}`;\n    $(\"resultModal\").classList.add(\"open\");\n  } else {\n    sfx.accuseWrong();\n    toast(`${p.nome} tinha um álibi! O verdadeiro assassino continua à solta…`);\n  }\n}\nfunction revealSolution(){\n  for (const row of marks) for (const m of row){ m.x = false; m.cands.clear(); m.conf = null; }\n  for (const p of CASE.people){\n    const [r,c] = p.cell;\n    marks[r][c].conf = p.id;\n  }\n  renderMarks();\n}\n$(\"btnKeep\").addEventListener(\"click\", () => $(\"resultModal\").classList.remove(\"open\"));\n$(\"btnAgain\").addEventListener(\"click\", () => {\n  $(\"resultModal\").classList.remove(\"open\");\n  $(\"newModal\").classList.add(\"open\");\n});\n\n/* ============================================================\n   NOVO CASO — modal\n============================================================ */\n$(\"btnNew\").addEventListener(\"click\", () => { renderDailyCard(); $(\"newModal\").classList.add(\"open\"); });\n$(\"btnCancelNew\").addEventListener(\"click\", () => $(\"newModal\").classList.remove(\"open\"));\n$(\"btnCloseNewX\").addEventListener(\"click\", () => $(\"newModal\").classList.remove(\"open\"));\n$(\"btnCloseAccuseX\").addEventListener(\"click\", () => $(\"accuseModal\").classList.remove(\"open\"));\n$(\"btnGen\").addEventListener(\"click\", () => {\n  $(\"newModal\").classList.remove(\"open\");\n  const N = parseInt($(\"selSize\").value, 10);\n  generateAsync(N, $(\"inpSeed\").value, $(\"selDiff\").value, c => {\n    if (!c){ toast(\"Não consegui montar este caso — tente outra seed.\"); return; }\n    startCase(c);\n  });\n});\n\n/* debug: simula a tela de fim de jogo com TODOS os suspeitos presos (lineup), via tweak do wrapper */\nfunction showAllArrestedLineup(){\n  if (!CASE) { window.__pendingAllArrested = true; return; }\n  const suspects = CASE.people.filter(p => !p.isVictim);\n  $(\"resultEmoji\").innerHTML = `<div style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:340px\">` +\n    suspects.map(p => `\n      <span class=\"mugshot\" style=\"width:72px;height:72px\" title=\"${p.nome}\">\n        ${avatarOf(p)}<span class=\"bars\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan>\n        <span class=\"stamp\" style=\"font-size:10px;padding:1px 4px;border-width:2px\">${p.genero===\"F\"?\"Presa\":\"Preso\"}<\u002Fspan>\n      <\u002Fspan>`).join(\"\") +\n    `<\u002Fdiv>`;\n  confettiBurst();\n  $(\"resultTitle\").textContent = \"Caso encerrado!\";\n  $(\"resultWho\").textContent = `Todos os ${suspects.length} suspeitos foram presos! (simulação)`;\n  $(\"resultStats\").textContent = `${CASE.scene.theme.titulo} · ${CASE.scene.N}×${CASE.scene.N}`;\n  $(\"resultModal\").classList.add(\"open\");\n}\nwindow.addEventListener(\"message\", e => {\n  if (e.data && e.data.type === \"thyagoDebug\" && e.data.action === \"allArrested\") showAllArrestedLineup();\n});\n\nfunction confettiBurst(){\n  const cores = [\"#e0a63c\",\"#b3554d\",\"#3f7d5a\",\"#3a6ea5\",\"#7d5a9e\",\"#f3d15c\"];\n  for (let i = 0; i < 32; i++){\n    const c = document.createElement(\"div\");\n    c.className = \"confetti\";\n    c.style.left = Math.random() * 100 + \"vw\";\n    c.style.background = cores[i % cores.length];\n    c.style.animationDuration = (1.6 + Math.random() * 1.6) + \"s\";\n    c.style.animationDelay = (Math.random() * .6) + \"s\";\n    document.body.appendChild(c);\n    setTimeout(() => c.remove(), 4200);\n  }\n}\nconst MOODS = [\"padrao\",\"noir\",\"sepia\"];\nconst MOOD_LABELS = {padrao:\"Padrão\",noir:\"Noir P&B\",sepia:\"Sépia arquivo antigo\"};\nfunction setMood(m, persist){\n  document.body.classList.remove(\"mood-noir\",\"mood-sepia\");\n  if (m && m !== \"padrao\") document.body.classList.add(\"mood-\" + m);\n  if (persist) try{ localStorage.setItem(\"thyagoMood\", m); }catch(e){}\n}\n(function(){\n  let saved = null;\n  try{ saved = localStorage.getItem(\"thyagoMood\"); }catch(e){}\n  if (saved) setMood(saved, false);\n})();\n$(\"btnMood\").addEventListener(\"click\", () => {\n  const current = MOODS.find(m => document.body.classList.contains(\"mood-\" + m)) || \"padrao\";\n  const next = MOODS[(MOODS.indexOf(current) + 1) % MOODS.length];\n  setMood(next, true);\n  toast(\"Clima: \" + MOOD_LABELS[next]);\n});\n\nfunction cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }\n\nfunction renderLegend(){\n  const scene = CASE.scene;\n  const present = new Set();\n  for (let r = 0; r < scene.N; r++)\n    for (let c = 0; c < scene.N; c++){\n      const o = scene.obj[r][c];\n      if (o && o !== \"__void\") present.add(o);\n    }\n  const occ = [], blocked = [];\n  for (const key of present) (OBJ[key].occ ? occ : blocked).push(key);\n  occ.sort(); blocked.sort();\n\n  const row = key => `\n    <div class=\"legRow\">\n      <span class=\"legIcon\">${ICONS[key]}<\u002Fspan>\n      <span class=\"legName\">${cap(OBJ[key].nome)}<\u002Fspan>\n    <\u002Fdiv>`;\n\n  let html = `<div class=\"legGroup ok\">✔ Podem ser ocupados<\u002Fdiv>`;\n  html += occ.length ? occ.map(row).join(\"\") : `<p class=\"legEmpty\">Nenhum objeto ocupável nesta cena.<\u002Fp>`;\n\n  html += `<div class=\"legGroup no\">✘ Não podem ser ocupados<\u002Fdiv>`;\n  html += blocked.map(row).join(\"\");\n\n  if ((scene.windows || []).length){\n    html += `\n      <div class=\"legRow\">\n        <span class=\"legIcon\">${ICONS.janela}<\u002Fspan>\n        <span class=\"legName\">Janela<small>Fica na parede, entre ou ao lado de células — nunca ocupável.<\u002Fsmall><\u002Fspan>\n      <\u002Fdiv>`;\n  }\n  $(\"legendBody\").innerHTML = html;\n}\n$(\"btnHelp\").addEventListener(\"click\", () => {\n  if (!CASE) return;\n  renderLegend();\n  $(\"legendModal\").classList.add(\"open\");\n});\n$(\"btnCloseLegend\").addEventListener(\"click\", () => $(\"legendModal\").classList.remove(\"open\"));\n$(\"btnCloseLegendX\").addEventListener(\"click\", () => $(\"legendModal\").classList.remove(\"open\"));\n$(\"btnHow\").addEventListener(\"click\", () => $(\"howModal\").classList.add(\"open\"));\n$(\"btnCloseHow\").addEventListener(\"click\", () => $(\"howModal\").classList.remove(\"open\"));\n$(\"btnCloseHowX\").addEventListener(\"click\", () => $(\"howModal\").classList.remove(\"open\"));\n\nfunction openPersonModal(p){\n  $(\"personAv\").innerHTML = avatarOf(p);\n  $(\"personName\").textContent =\n    (p.isVictim ? \"✝ \" : letters[p.id] + \" · \") + p.nome + (p.isVictim ? \" (a Vítima)\" : \"\");\n  const t = p.traits, fem = p.genero === \"F\";\n  const chips = [ fem ? \"Mulher\" : \"Homem\" ];\n  if (t.oculos) chips.push(\"👓 Óculos\");\n  if (t.barba)  chips.push(\"🧔 Barba\");\n  if (t.brinco) chips.push(\"💛 Brincos\");\n  if (t.careca) chips.push(\"Careca\");\n  $(\"personTraits\").innerHTML = chips.map(c =>\n    `<span class=\"traitChip\">${c}<\u002Fspan>`).join(\"\");\n  $(\"personModal\").querySelector(\".traitNote\").textContent = chips.length > 1\n    ? \"Compare esses sinais com as pistas — alguns suspeitos são reconhecidos por eles.\"\n    : \"Sem sinais particulares — este suspeito passa despercebido na multidão.\";\n  $(\"personModal\").classList.add(\"open\");\n}\n$(\"btnClosePerson\").addEventListener(\"click\", () => $(\"personModal\").classList.remove(\"open\"));\n$(\"btnClosePersonX\").addEventListener(\"click\", () => $(\"personModal\").classList.remove(\"open\"));\n\nfunction toast(msg){\n  const t = $(\"toast\");\n  t.textContent = msg;\n  t.classList.add(\"show\");\n  clearTimeout(t._h);\n  t._h = setTimeout(() => t.classList.remove(\"show\"), 2600);\n}\nwindow.addEventListener(\"resize\", () => { if (CASE) renderBoard(); });\n/* handle de depuração (console/testes) */\nwindow.__dbg = () => ({ CASE, marks, tool, finished, stats });\nwindow.__setTool = t => { tool = t; renderTray(); };\n\n/* primeiro caso */\ngenerateAsync(7, \"\", \"logic\", c => startCase(c));\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
