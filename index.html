\n    a |= 0; a = a + 0x6D2B79F5 | 0;\n    let t = Math.imul(a ^ a >>> 15, 1 | a);\n    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;\n    return ((t ^ t >>> 14) >>> 0) / 4294967296;\n  };\n}\nfunction hashSeed(str){\n  let h = 1779033703 ^ str.length;\n  for (let i = 0; i < str.length; i++){\n    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);\n    h = h << 13 | h >>> 19;\n  }\n  return (h >>> 0) || 1;\n}\nlet RNG = mulberry32(12345);\nconst rnd    = () => RNG();\nconst rndInt = (a,b) => a + Math.floor(rnd() * (b - a + 1));   // inclusivo\nconst pick   = arr => arr[Math.floor(rnd() * arr.length)];\nfunction shuffle(arr){\n  const a = arr.slice();\n  for (let i = a.length - 1; i > 0; i--){\n    const j = Math.floor(rnd() * (i + 1));\n    [a[i], a[j]] = [a[j], a[i]];\n  }\n  return a;\n}\n\n/* ============================================================\n   DADOS: temas, objetos, nomes\n============================================================ */\nconst THEMES = [\n  { id:\"casa\", titulo:\"Residência\",\n    salas:[\"Sala de Estar\",\"Cozinha\",\"Quarto Principal\",\"Escritório\",\"Corredor\",\"Sala de Jantar\",\"Banheiro\",\"Quarto de Hóspedes\",\"Lavanderia\",\"Varanda\"] },\n  { id:\"apartamento\", titulo:\"Apartamento\",\n    salas:[\"Quarto 1\",\"Quarto 2\",\"Quarto 3\",\"Corredor\",\"Banheiro\",\"Cozinha\",\"Sala de Estar\",\"Área de Serviço\"] },\n  { id:\"escritorio\", titulo:\"Escritório Corporativo\",\n    salas:[\"Recepção\",\"Sala de Reuniões\",\"Controle de Segurança\",\"Antessala\",\"Corredor\",\"Cabine 1\",\"Cabine 2\",\"Cabine 3\",\"Sala do Pessoal\",\"Gabinete do Gerente\",\"Copa\"] },\n  { id:\"academia\", titulo:\"Academia de Boxe\",\n    salas:[\"Sala de Treino\",\"Ringue\",\"Vestiário\",\"Recepção\",\"Depósito\",\"Sala dos Armários\",\"Corredor\"],\n    extraBlocked:[\"saco_boxe\",\"cacifo\"] },\n  { id:\"teatro\", titulo:\"Teatro Municipal\",\n    salas:[\"Palco\",\"Plateia\",\"Camarim\",\"Foyer\",\"Bilheteria\",\"Bastidores\",\"Corredor\"],\n    extraBlocked:[\"estatua\"] },\n  { id:\"posto\", titulo:\"Posto de Gasolina\",\n    salas:[\"Área de Abastecimento\",\"Loja de Conveniência\",\"Oficina\",\"Escritório\",\"Depósito\",\"Lava-Rápido\",\"Pátio\"],\n    extraOcc:[\"carro\",\"mancha_oleo\"], extraBlocked:[\"bomba_gasolina\",\"pedregulho\"] },\n  { id:\"loja\", titulo:\"Loja de Presentes\",\n    salas:[\"Salão\",\"Balcão\",\"Estoque\",\"Vitrine\",\"Escritório\",\"Embrulhos\",\"Corredor\"],\n    extraBlocked:[\"caixa_registradora\",\"presente\"] },\n];\n\n// tipos de objeto: occ = pode ser ocupado\nconst OBJ = {\n  /* padrão — ocupáveis */\n  cadeira:   { occ:true,  nome:\"cadeira\",   art:\"uma\" },\n  cama:      { occ:true,  nome:\"cama\",      art:\"uma\" },\n  tapete:    { occ:true,  nome:\"tapete\",    art:\"um\"  },\n  /* padrão — bloqueados */\n  mesa:      { occ:false, nome:\"mesa\",      art:\"uma\" },\n  televisao: { occ:false, nome:\"televisão\", art:\"uma\" },\n  planta:    { occ:false, nome:\"planta\",    art:\"uma\" },\n  estante:   { occ:false, nome:\"estante\",   art:\"uma\" },\n  caixa:     { occ:false, nome:\"caixa\",     art:\"uma\" },\n  /* temáticos — ocupáveis */\n  carro:       { occ:true,  nome:\"carro\",           art:\"um\"  },\n  mancha_oleo: { occ:true,  nome:\"mancha de óleo\",  art:\"uma\" },\n  /* temáticos — bloqueados */\n  caixa_registradora: { occ:false, nome:\"caixa registradora\", art:\"uma\" },\n  presente:           { occ:false, nome:\"presente\",           art:\"um\"  },\n  estatua:            { occ:false, nome:\"estátua\",            art:\"uma\" },\n  pedregulho:         { occ:false, nome:\"pedregulho\",         art:\"um\"  },\n  cacifo:             { occ:false, nome:\"armário\",            art:\"um\"  },\n  saco_boxe:          { occ:false, nome:\"saco de boxe\",       art:\"um\"  },\n  bomba_gasolina:     { occ:false, nome:\"bomba de gasolina\",  art:\"uma\" },\n};\nconst BLOCKED_KEYS = [\"mesa\",\"televisao\",\"planta\",\"estante\",\"caixa\"];\nconst OCC_KEYS     = [\"cadeira\",\"tapete\",\"cama\"];\n\n/* nomes por inicial: suspeitos recebem A, B, C… em sequência (iniciais\n   únicas no caso) e a vítima sempre tem nome com V, como manda a tradição */\nconst NOMES = {\n  A:{ F:[\"Ana\",\"Alice\",\"Amanda\"],      M:[\"André\",\"Arthur\",\"Augusto\"] },\n  B:{ F:[\"Beatriz\",\"Bruna\",\"Bianca\"],  M:[\"Bruno\",\"Bernardo\",\"Benjamin\"] },\n  C:{ F:[\"Carla\",\"Camila\",\"Cecília\"],  M:[\"Caio\",\"Carlos\",\"César\"] },\n  D:{ F:[\"Denise\",\"Daniela\",\"Débora\"], M:[\"Davi\",\"Diego\",\"Danilo\"] },\n  E:{ F:[\"Elisa\",\"Eduarda\",\"Estela\"],  M:[\"Eduardo\",\"Enzo\",\"Emílio\"] },\n  F:{ F:[\"Fernanda\",\"Flávia\",\"Fabiana\"],M:[\"Felipe\",\"Fábio\",\"Francisco\"] },\n  G:{ F:[\"Gabriela\",\"Giovana\",\"Gilda\"],M:[\"Gustavo\",\"Gabriel\",\"Geraldo\"] },\n  H:{ F:[\"Helena\",\"Heloísa\",\"Hilda\"],  M:[\"Henrique\",\"Hugo\",\"Heitor\"] },\n  I:{ F:[\"Iris\",\"Isabela\",\"Ingrid\"],   M:[\"Igor\",\"Ivan\",\"Isaac\"] },\n  J:{ F:[\"Juliana\",\"Joana\",\"Júlia\"],   M:[\"João\",\"José\",\"Jorge\"] },\n  K:{ F:[\"Karen\",\"Kátia\",\"Kelly\"],     M:[\"Kléber\",\"Kevin\",\"Kauã\"] },\n  L:{ F:[\"Larissa\",\"Lúcia\",\"Lívia\"],   M:[\"Leandro\",\"Lucas\",\"Luiz\"] },\n  V:{ F:[\"Vera\",\"Valentina\",\"Vitória\"],M:[\"Vicente\",\"Victor\",\"Valdir\"] },\n};\n\n/* ============================================================\n   GERAÇÃO DE CENA\n   grid N×N -> células \"void\" opcionais (contorno irregular)\n   -> salas em formato livre (crescimento de regiões / polyomino)\n   -> mobília (inclui objetos multi-célula) + janelas\n============================================================ */\nfunction makeVoidMask(N){\n  // recorta 1 ou 2 retângulos de cantos (como mapas com contorno em \"L\"/\"Z\")\n  const mask = Array.from({length:N}, () => Array(N).fill(false));\n  if (N < 5 || rnd() < .45) return mask; // grids pequenos: sem recorte\n  const nCuts = rnd() < .3 ? 2 : 1;\n  const corners = shuffle([\"NW\",\"NE\",\"SW\",\"SE\"]).slice(0, nCuts);\n  for (const corner of corners){\n    const a = rndInt(1, Math.max(1, Math.floor(N/2) - 1)); // altura\n    const b = rndInt(1, Math.max(1, Math.floor(N/2) - 1)); // largura\n    for (let r = 0; r < a; r++){\n      for (let c = 0; c < b; c++){\n        const rr = corner[0] === \"N\" ? r : N - 1 - r;\n        const cc = corner[1] === \"W\" ? c : N - 1 - c;\n        mask[rr][cc] = true;\n      }\n    }\n  }\n  // toda linha e coluna precisa manter pelo menos 2 células reais\n  for (let r = 0; r < N; r++)\n    if (mask[r].filter(v => !v).length < 2) return Array.from({length:N}, () => Array(N).fill(false));\n  for (let c = 0; c < N; c++)\n    if ([...Array(N).keys()].filter(r => !mask[r][c]).length < 2) return Array.from({length:N}, () => Array(N).fill(false));\n  return mask;\n}\n\nfunction regionRooms(N, voidMask, maxK){\n  const cells = [];\n  for (let r = 0; r < N; r++)\n    for (let c = 0; c < N; c++)\n      if (!voidMask[r][c]) cells.push([r,c]);\n\n  const total = cells.length;\n  const lo = Math.max(3, Math.round(N * .55));\n  const hi = Math.max(lo, Math.round(N * .75));\n  const K = Math.min(rndInt(lo, hi), 8, maxK);\n  const roomOf = Array.from({length:N}, () => Array(N).fill(-1));\n\n  // sementes espalhadas\n  const seeds = [];\n  for (const [r,c] of shuffle(cells)){\n    if (seeds.every(([sr,sc]) => Math.abs(sr-r) + Math.abs(sc-c) >= 2)){\n      seeds.push([r,c]);\n      if (seeds.length === K) break;\n    }\n  }\n  if (seeds.length < K) return null;\n  seeds.forEach(([r,c], i) => roomOf[r][c] = i);\n  const sizes = Array(K).fill(1);\n  let unassigned = total - K;\n\n  // crescimento: salas menores têm prioridade -> tamanhos equilibrados,\n  // mas o caminho aleatório cria formatos em L/T e corredores\n  let guard = 0;\n  while (unassigned > 0 && guard++ < total * 30){\n    const order = [...Array(K).keys()].sort((a,b) => sizes[a] - sizes[b] + (rnd() - .5));\n    let grew = false;\n    for (const k of order){\n      const opts = [];\n      for (let r = 0; r < N; r++){\n        for (let c = 0; c < N; c++){\n          if (roomOf[r][c] !== k) continue;\n          for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){\n            const r2 = r + dr, c2 = c + dc;\n            if (r2 < 0 || r2 >= N || c2 < 0 || c2 >= N) continue;\n            if (voidMask[r2][c2] || roomOf[r2][c2] !== -1) continue;\n            opts.push([r2,c2]);\n          }\n        }\n      }\n      if (!opts.length) continue;\n      const [r,c] = pick(opts);\n      roomOf[r][c] = k; sizes[k]++; unassigned--; grew = true;\n      break;\n    }\n    if (!grew) break;\n  }\n  // bolsões restantes: anexa à sala vizinha\n  for (const [r,c] of cells){\n    if (roomOf[r][c] !== -1) continue;\n    for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){\n      const r2 = r + dr, c2 = c + dc;\n      if (r2 >= 0 && r2 < N && c2 >= 0 && c2 < N && roomOf[r2][c2] >= 0){\n        roomOf[r][c] = roomOf[r2][c2]; break;\n      }\n    }\n    if (roomOf[r][c] === -1) return null;\n  }\n  // valida tamanhos\n  const counts = Array(K).fill(0);\n  for (const [r,c] of cells) counts[roomOf[r][c]]++;\n  if (counts.some(x => x < 2)) return null;\n  return { roomOf, K };\n}\n\nfunction generateScene(N){\n  const theme = pick(THEMES);\n  const voidMask = makeVoidMask(N);\n  const reg = regionRooms(N, voidMask, theme.salas.length);\n  if (!reg) return null;\n  const { roomOf, K } = reg;\n\n  const roomNames = shuffle(theme.salas).slice(0, K);\n  const rooms = [];\n  for (let i = 0; i < K; i++){\n    const cellsRm = [];\n    for (let r = 0; r < N; r++)\n      for (let c = 0; c < N; c++)\n        if (roomOf[r][c] === i) cellsRm.push([r,c]);\n    rooms.push({ id:i, nome:roomNames[i], cells:cellsRm });\n  }\n\n  // mobília\n  const obj = Array.from({length:N}, () => Array(N).fill(null));\n  for (let r = 0; r < N; r++)\n    for (let c = 0; c < N; c++)\n      if (voidMask[r][c]) obj[r][c] = \"__void\";\n\n  const strips = []; // mobília multi-célula p/ render como peça única\n  const sameRoomPair = (rm, len, tryHoriz) => {\n    // acha uma faixa reta livre de `len` células dentro da sala\n    const opts = [];\n    for (const [r,c] of rm.cells){\n      for (const [dr,dc] of tryHoriz ? [[0,1]] : [[1,0]]){\n        const strip = [[r,c]];\n        for (let k = 1; k < len; k++) strip.push([r + dr*k, c + dc*k]);\n        if (strip.every(([r2,c2]) =>\n          r2 >= 0 && r2 < N && c2 >= 0 && c2 < N &&\n          roomOf[r2][c2] === rm.id && !obj[r2][c2])) opts.push(strip);\n      }\n    }\n    return opts.length ? pick(opts) : null;\n  };\n\n  const blockedPool = BLOCKED_KEYS.concat(theme.extraBlocked || []);\n  const occPool = [\"cadeira\",\"cadeira\"].concat(theme.extraOcc || []); // cadeira 2x mais comum\n\n  for (const rm of rooms){\n    const size = rm.cells.length;\n    let nBlocked = size <= 4 ? 1 : rndInt(1, Math.min(3, Math.floor(size/3)));\n    let nOcc     = rndInt(1, Math.min(3, Math.floor(size/3) + 1));\n\n    // cama 1x2 (quartos têm mais chance; salas grandes podem ter 2)\n    const isQuarto = /Quarto/i.test(rm.nome);\n    let nBeds = 0;\n    if (size >= 4 && (isQuarto ? rnd() < .9 : rnd() < .3)) nBeds = 1;\n    if (isQuarto && size >= 8 && rnd() < .4) nBeds = 2;\n    for (let b = 0; b < nBeds; b++){\n      const strip = sameRoomPair(rm, 2, rnd() < .5);\n      if (!strip) break;\n      for (const [r,c] of strip) obj[r][c] = \"cama\";\n      strips.push({ key:\"cama\", cells:strip });\n      if (nOcc > 0) nOcc--;\n    }\n\n    // tapete comprido 1x2/1x3 ou tapete simples\n    if (nOcc > 0 && rnd() < .55){\n      const len = size >= 7 ? rndInt(1,3) : rndInt(1,2);\n      const strip = len === 1 ? null : sameRoomPair(rm, len, rnd() < .5);\n      if (strip){\n        for (const [r,c] of strip) obj[r][c] = \"tapete\";\n        strips.push({ key:\"tapete\", cells:strip });\n      }\n      else {\n        const free = rm.cells.filter(([r,c]) => !obj[r][c]);\n        if (free.length){ const [r,c] = pick(free); obj[r][c] = \"tapete\"; }\n      }\n      nOcc--;\n    }\n    // cadeiras\n    for (let k = 0; k < nOcc; k++){\n      const free = rm.cells.filter(([r,c]) => !obj[r][c]);\n      if (!free.length) break;\n      const [r,c] = pick(free);\n      obj[r][c] = pick(occPool);\n    }\n    // mesa 1x2 às vezes\n    if (nBlocked > 0 && size >= 5 && rnd() < .4){\n      const strip = sameRoomPair(rm, 2, rnd() < .5);\n      if (strip){\n        const free = rm.cells.filter(([r,c]) => !obj[r][c]).length;\n        if (free - 2 >= 1){ // nunca lotar\n          for (const [r,c] of strip) obj[r][c] = \"mesa\";\n          strips.push({ key:\"mesa\", cells:strip });\n          nBlocked--;\n        }\n      }\n    }\n    // demais bloqueados\n    for (let k = 0; k < nBlocked; k++){\n      const free = rm.cells.filter(([r,c]) => !obj[r][c]);\n      if (free.length <= 1) break;\n      const [r,c] = pick(free);\n      obj[r][c] = pick(blockedPool);\n    }\n  }\n\n  // célula livre em toda linha e coluna\n  for (let r = 0; r < N; r++)\n    if (![...Array(N).keys()].some(c => cellFree(obj,r,c))) return null;\n  for (let c = 0; c < N; c++)\n    if (![...Array(N).keys()].some(r => cellFree(obj,r,c))) return null;\n\n  // janelas: paredes grossas (borda externa, void ou entre salas)\n  const windows = [];\n  const wallOpts = [];\n  const isOut = (r,c) => r < 0 || r >= N || c < 0 || c >= N || voidMask[r][c];\n  for (let r = 0; r < N; r++){\n    for (let c = 0; c < N; c++){\n      if (voidMask[r][c]) continue;\n      if (isOut(r-1,c)) wallOpts.push({r,c,side:\"N\"});\n      if (isOut(r+1,c)) wallOpts.push({r,c,side:\"S\"});\n      if (isOut(r,c-1)) wallOpts.push({r,c,side:\"W\"});\n      if (isOut(r,c+1)) wallOpts.push({r,c,side:\"E\"});\n      if (r+1 < N && !voidMask[r+1][c] && roomOf[r][c] !== roomOf[r+1][c]) wallOpts.push({r,c,side:\"S\",internal:true});\n      if (c+1 < N && !voidMask[r][c+1] && roomOf[r][c] !== roomOf[r][c+1]) wallOpts.push({r,c,side:\"E\",internal:true});\n    }\n  }\n  for (const w of shuffle(wallOpts).slice(0, rndInt(2, Math.min(6, Math.ceil(N * .6))))) windows.push(w);\n\n  return { N, theme, rooms, roomOf, obj, windows, voidMask, strips };\n}\n\nfunction cellFree(obj, r, c){\n  const o = obj[r][c];\n  if (o === \"__void\") return false;\n  return !o || OBJ[o].occ;\n}\n\n/* células adjacentes a uma janela (memoizado por cena) */\nfunction windowCells(scene){\n  if (scene._winSet) return scene._winSet;\n  const set = new Set();\n  for (const w of scene.windows){\n    set.add(w.r + \",\" + w.c);\n    let r2 = w.r, c2 = w.c;\n    if (w.side === \"N\") r2--;\n    if (w.side === \"S\") r2++;\n    if (w.side === \"W\") c2--;\n    if (w.side === \"E\") c2++;\n    if (r2 >= 0 && r2 < scene.N && c2 >= 0 && c2 < scene.N) set.add(r2 + \",\" + c2);\n  }\n  scene._winSet = set;\n  return set;\n}\n\n/* vizinhos ortogonais na MESMA sala */\nfunction neighborsSameRoom(scene, r, c){\n  const out = [];\n  for (const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){\n    const r2 = r + dr, c2 = c + dc;\n    if (r2 < 0 || r2 >= scene.N || c2 < 0 || c2 >= scene.N) continue;\n    if (scene.roomOf[r2][c2] !== scene.roomOf[r][c]) continue;\n    out.push([r2,c2]);\n  }\n  return out;\n}\n\nfunction isRoomCorner(scene, r, c){\n  // canto = a célula tem parede (fim da sala) em pelo menos um lado\n  // vertical E um lado horizontal adjacentes (N/S x E/W)\n  const myRoom = scene.roomOf[r][c];\n  const wall = (r2,c2) =>\n    r2 < 0 || r2 >= scene.N || c2 < 0 || c2 >= scene.N || scene.roomOf[r2][c2] !== myRoom;\n  const nW = wall(r-1,c), sW = wall(r+1,c), wW = wall(r,c-1), eW = wall(r,c+1);\n  return (nW || sW) && (wW || eW) &&\n    ((nW && wW) || (nW && eW) || (sW && wW) || (sW && eW));\n}\n\n/* ============================================================\n   PESSOAS: N pessoas (N-1 suspeitos + vítima), linhas/colunas distintas\n============================================================ */\n/* traços visuais determinísticos (mesma fonte dos bustos da UI):\n   sequência FIXA de sorteios — não reordenar! */\nfunction personTraits(nome, genero){\n  const rng = mulberry32(hashSeed(nome + \"|\" + genero));\n  const t = {};\n  t.bg    = Math.floor(rng() * 7);\n  t.skin  = Math.floor(rng() * 5);\n  t.shirt = Math.floor(rng() * 7);\n  t.hair  = Math.floor(rng() * 6);\n  t.style = Math.floor(rng() * 4);\n  t.oculos = rng() < .25;\n  t.barba  = genero === \"M\" && rng() < .4;\n  t.brinco = genero === \"F\" && rng() < .35;\n  t.careca = genero === \"M\" && t.style === 3 && rng() < .5;\n  return t;\n}\n\nfunction placePeople(scene){\n  const N = scene.N;\n  // matching aleatório linha->célula livre com colunas distintas (backtracking com shuffle)\n  const rows = shuffle([...Array(N).keys()]);\n  const usedCols = new Set();\n  const placement = Array(N).fill(null); // por linha real: col\n\n  function bt(i){\n    if (i === rows.length) return true;\n    const r = rows[i];\n    const cols = shuffle([...Array(N).keys()]);\n    for (const c of cols){\n      if (usedCols.has(c)) continue;\n      if (!cellFree(scene.obj, r, c)) continue;\n      usedCols.add(c); placement[r] = c;\n      if (bt(i + 1)) return true;\n      usedCols.delete(c); placement[r] = null;\n    }\n    return false;\n  }\n  if (!bt(0)) return null;\n\n  const cells = [];\n  for (let r = 0; r < N; r++) cells.push([r, placement[r]]);\n\n  // vítima: precisa estar numa sala com exatamente 2 pessoas\n  const countByRoom = {};\n  for (const [r,c] of cells){\n    const id = scene.roomOf[r][c];\n    countByRoom[id] = (countByRoom[id] || 0) + 1;\n  }\n  const victimOpts = cells.filter(([r,c]) => countByRoom[scene.roomOf[r][c]] === 2);\n  if (!victimOpts.length) return null;\n  const vCell = pick(victimOpts);\n\n  // nomes: suspeitos com iniciais sequenciais A, B, C… (únicas);\n  // vítima sempre com nome em V\n  const people = [];\n  const cellsShuffled = shuffle(cells.filter(x => x !== vCell));\n  cellsShuffled.forEach(([r,c], i) => {\n    const letra = String.fromCharCode(65 + i); // A, B, C…\n    const fem = rnd() < .5;\n    const nome = pick(NOMES[letra][fem ? \"F\" : \"M\"]);\n    people.push({\n      id: people.length,\n      nome, letra,\n      genero: fem ? \"F\" : \"M\",\n      traits: personTraits(nome, fem ? \"F\" : \"M\"),\n      isVictim: false,\n      cell: [r,c],\n    });\n  });\n  const femV = rnd() < .5;\n  const nomeV = pick(NOMES.V[femV ? \"F\" : \"M\"]);\n  people.push({\n    id: people.length,\n    nome: nomeV, letra: \"V\",\n    genero: femV ? \"F\" : \"M\",\n    traits: personTraits(nomeV, femV ? \"F\" : \"M\"),\n    isVictim: true,\n    cell: vCell,\n  });\n  return people;\n}\n\n/* ============================================================\n   PISTAS\n   tipos: on | adjObj | window | room | corner | alone | genderRoom | cardinal\n============================================================ */\nconst DIR_TXT  = { N:\"ao norte\", S:\"ao sul\", E:\"a leste\", W:\"a oeste\" };\nconst DIR8_TXT = { N:\"ao norte\", S:\"ao sul\", E:\"a leste\", W:\"a oeste\",\n  NE:\"a nordeste\", NW:\"a noroeste\", SE:\"a sudeste\", SW:\"a sudoeste\" };\nconst ORD_F = [\"primeira\",\"segunda\",\"terceira\",\"quarta\",\"quinta\",\"sexta\",\n  \"sétima\",\"oitava\",\"nona\",\"décima\",\"décima primeira\",\"décima segunda\"];\n\nfunction roomLoc(nome){ // \"no X\" / \"na X\" / \"nos X\"\n  if (/^Bastidores/i.test(nome)) return \"nos \" + nome;\n  const fem = /^(Sala|Cozinha|Recepção|Antessala|Cabine|Copa|Plateia|Bilheteria|Área|Lavanderia|Varanda|Despensa|Loja|Entrada)/i.test(nome);\n  return (fem ? \"na \" : \"no \") + nome;\n}\nfunction objDef(key){ return (OBJ[key].art === \"uma\" ? \"da \" : \"do \") + OBJ[key].nome; }\nfunction objIndef(key){ return OBJ[key].art + \" \" + OBJ[key].nome; }\nfunction artNome(q){ return (q.genero === \"F\" ? \"a \" : \"o \") + q.nome; }\nfunction genderCountPhrase(n, g){\n  const F = [\"\",\"uma mulher\",\"duas mulheres\",\"três mulheres\",\"quatro mulheres\",\"cinco mulheres\"];\n  const M = [\"\",\"um homem\",\"dois homens\",\"três homens\",\"quatro homens\",\"cinco homens\"];\n  const arr = g === \"F\" ? F : M;\n  return arr[n] || n + (g === \"F\" ? \" mulheres\" : \" homens\");\n}\nfunction occPhrase(key, fem){\n  switch (key){\n    case \"cama\":        return \"numa cama\";\n    case \"cadeira\":     return \"sentad\" + (fem ? \"a\" : \"o\") + \" numa cadeira\";\n    case \"tapete\":      return \"num tapete\";\n    case \"carro\":       return \"num carro\";\n    case \"mancha_oleo\": return \"numa mancha de óleo\";\n    default:            return (OBJ[key].art === \"uma\" ? \"numa \" : \"num \") + OBJ[key].nome;\n  }\n}\n\n/* ============================================================\n   PROGRESSÃO DE DIFICULDADE POR TAMANHO DO MAPA\n   Cada tipo de pista pertence a uma categoria (como no livro):\n   básico (âncoras absolutas) → intermediário (relativo/negativas)\n   → avançado (offsets, diagonais, condições globais). O peso de\n   cada categoria varia suavemente com N — sem cortes bruscos —\n   então mapas pequenos favorecem pistas básicas e mapas grandes\n   favorecem avançadas, com uma faixa intermediária no meio.\n============================================================ */\nconst CLUE_TIER = {\n  // básico — âncoras absolutas (4×4 a 6×6 no livro)\n  on:\"basico\", onlyOnObj:\"basico\", adjObj:\"basico\", room:\"basico\",\n  window:\"basico\", corner:\"basico\",\n  // intermediário — relativo + negativas + social simples (8×8 a 10×10)\n  cardinal:\"intermediario\", rowIs:\"intermediario\", colIs:\"intermediario\",\n  adjObjNeg:\"intermediario\", onNeg:\"intermediario\", roomNeg:\"intermediario\",\n  wallAdjNeg:\"intermediario\", sameRoomAs:\"intermediario\", alone:\"intermediario\",\n  // avançado — offsets, diagonais, globais, interseção de fatores (10×10 a 12×12)\n  colOffsetAdj:\"avancado\", diagPerson:\"avancado\", cardinalObj:\"avancado\",\n  noEmptyRoom:\"avancado\", countOnObj:\"avancado\", traitAll:\"avancado\",\n  traitSomeone:\"avancado\", genderRoom:\"avancado\", genderRoomNeg:\"avancado\",\n  countGenderInRoom:\"avancado\", aloneWith:\"avancado\", aloneWithGender:\"avancado\",\n  someoneInRoomAdj:\"avancado\",\n};\n// tipos só validados na folha da busca (sem poda incremental no solver) —\n// se TODOS os suspeitos recebessem só pistas destes tipos, o backtracking\n// perderia toda restrição inicial e explodiria combinatoriamente. Por isso\n// a pista-BASE de cada suspeito sempre evita este conjunto; eles entram\n// livremente como pistas extras (2ª, 3ª...), já com o tabuleiro ancorado.\nconst WEAK_CLUE_TYPES = new Set([\n  \"noEmptyRoom\", \"countOnObj\", \"traitAll\", \"traitSomeone\",\n  \"someoneInRoomAdj\", \"genderRoom\", \"genderRoomNeg\", \"countGenderInRoom\",\n  \"colOffsetAdj\",\n]);\nfunction smoothstep(e0, e1, x){\n  const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));\n  return t * t * (3 - 2 * t);\n}\nfunction tierWeights(N){\n  // básico: forte até 6, esvanece perto de 9+ (nunca some de vez — sempre\n  // pode haver uma \"estava numa cama\" mesmo num 12×12)\n  const basico = (1 - smoothstep(6, 9, N)) * 0.92 + 0.10;\n  // avançado: quase ausente até 7, cresce forte a partir de 8, pleno em 12\n  const avancado = smoothstep(7, 12, N) * 0.95 + 0.06;\n  // intermediário: preenche a transição, com pico em torno de 8-10\n  const intermediario = 0.35 + 0.65 * smoothstep(6, 9, N) * (1 - smoothstep(9, 13, N));\n  return { basico, intermediario, avancado };\n}\nfunction applyTierWeights(pool, N){\n  const w = tierWeights(N);\n  for (const cl of pool){\n    const tier = CLUE_TIER[cl.type];\n    if (tier) cl.peso = cl.peso * w[tier];\n  }\n  return pool;\n}\n\nfunction genCluePool(scene, people){\n  const winSet = windowCells(scene);\n  const pool = [];\n  const suspects = people.filter(p => !p.isVictim);\n  const countByRoom = {};\n  for (const p of people){\n    const id = scene.roomOf[p.cell[0]][p.cell[1]];\n    countByRoom[id] = (countByRoom[id] || 0) + 1;\n  }\n  // instâncias de cada tipo de objeto (célula a célula)\n  const objCells = {};\n  for (let r = 0; r < scene.N; r++)\n    for (let c = 0; c < scene.N; c++){\n      const o = scene.obj[r][c];\n      if (o && o !== \"__void\") (objCells[o] = objCells[o] || []).push([r,c]);\n    }\n  const typesInScene = Object.keys(objCells);\n\n  for (const p of suspects){\n    const [r,c] = p.cell;\n    const roomId = scene.roomOf[r][c];\n    const o = scene.obj[r][c];\n\n    /* --- ocupação de objetos --- */\n    if (o && OBJ[o].occ){\n      pool.push({ pid:p.id, type:\"on\", obj:o, peso:3 });\n      // \"era a única pessoa em X\"\n      const unica = !people.some(q => q.id !== p.id &&\n        scene.obj[q.cell[0]][q.cell[1]] === o);\n      if (unica) pool.push({ pid:p.id, type:\"onlyOnObj\", obj:o, peso:3 });\n    }\n    for (const k of typesInScene){\n      if (OBJ[k].occ && o !== k) // negação só faz sentido se o objeto existe\n        pool.push({ pid:p.id, type:\"onNeg\", obj:k, peso:1 });\n    }\n\n    /* --- adjacência direta (e negações) --- */\n    const adjacentesAll = new Set();\n    for (const [r2,c2] of neighborsSameRoom(scene, r, c)){\n      const o2 = scene.obj[r2][c2];\n      if (o2) adjacentesAll.add(o2);\n    }\n    // para a pista POSITIVA \"ao lado de X\", excluímos X == o (o próprio\n    // objeto que a pessoa ocupa): em peças multi-célula (cama/tapete 1×2+),\n    // a célula-irmã do mesmo objeto sempre conta como \"adjacente\", gerando\n    // a frase ambígua \"estava ao lado de um tapete\" quando ela está SOBRE\n    // um tapete. A negação usa o conjunto completo, senão \"não estava ao\n    // lado de tapete\" ficaria falso nesse caso.\n    for (const o2 of adjacentesAll){\n      if (o2 === o) continue;\n      pool.push({ pid:p.id, type:\"adjObj\", obj:o2, peso:3 });\n    }\n    for (const k of typesInScene){\n      if (!adjacentesAll.has(k))\n        pool.push({ pid:p.id, type:\"adjObjNeg\", obj:k, peso:1 });\n    }\n\n    /* --- geometria / arquitetura --- */\n    if (winSet.has(r + \",\" + c))\n      pool.push({ pid:p.id, type:\"window\", peso:3 });\n    if (isRoomCorner(scene, r, c))\n      pool.push({ pid:p.id, type:\"corner\", peso:2 });\n    if (neighborsSameRoom(scene, r, c).length === 4)\n      pool.push({ pid:p.id, type:\"wallAdjNeg\", peso:1 });\n\n    /* --- divisão (e negação) --- */\n    pool.push({ pid:p.id, type:\"room\", roomId, peso:1 });\n    for (const rm of scene.rooms)\n      if (rm.id !== roomId)\n        pool.push({ pid:p.id, type:\"roomNeg\", roomId:rm.id, peso:1 });\n\n    /* --- coordenadas de grelha --- */\n    pool.push({ pid:p.id, type:\"rowIs\", row:r, peso:2 });\n    pool.push({ pid:p.id, type:\"colIs\", col:c, peso:2 });\n\n    /* --- bússola p/ objetos (instância única; permite diagonais) --- */\n    for (const k of typesInScene){\n      if (objCells[k].length !== 1) continue;\n      const [ro,co] = objCells[k][0];\n      let dir = (r < ro ? \"N\" : r > ro ? \"S\" : \"\") +\n                (c < co ? \"W\" : c > co ? \"E\" : \"\");\n      dir = dir.replace(\"NW\",\"NW\").replace(\"NE\",\"NE\"); // ordem N/S antes de E/W\n      if (!dir) continue;\n      const sameRoom = scene.roomOf[ro][co] === roomId;\n      pool.push({ pid:p.id, type:\"cardinalObj\", obj:k, dir, sameRoom, peso:2 });\n    }\n\n    /* --- social --- */\n    if (countByRoom[roomId] === 1)\n      pool.push({ pid:p.id, type:\"alone\", peso:2 });\n    if (countByRoom[roomId] === 2){\n      const partner = people.find(q => q.id !== p.id &&\n        scene.roomOf[q.cell[0]][q.cell[1]] === roomId);\n      if (!partner.isVictim)\n        pool.push({ pid:p.id, type:\"aloneWith\", ref:partner.id, peso:3 });\n      pool.push({ pid:p.id, type:\"aloneWithGender\", g:partner.genero, peso:2 });\n    }\n    for (const q of suspects){\n      if (q.id === p.id) continue;\n      if (scene.roomOf[q.cell[0]][q.cell[1]] === roomId)\n        pool.push({ pid:p.id, type:\"sameRoomAs\", ref:q.id, peso:2 });\n    }\n    for (const g of [\"F\",\"M\"]){\n      const outrosComG = people.filter(q => q.id !== p.id && q.genero === g &&\n        scene.roomOf[q.cell[0]][q.cell[1]] === roomId);\n      if (outrosComG.length > 0){\n        pool.push({ pid:p.id, type:\"genderRoom\", g, peso:1 });\n        // contagem exata por gênero no cômodo (nível avançado)\n        pool.push({ pid:p.id, type:\"countGenderInRoom\", g, n:outrosComG.length, peso:1 });\n      } else {\n        // \"Não havia nenhuma mulher/homem no seu cômodo\"\n        pool.push({ pid:p.id, type:\"genderRoomNeg\", g, peso:1 });\n      }\n    }\n    // \"havia alguém no seu cômodo ao lado de X\" — refere-se a OUTRA pessoa,\n    // por isso excluímos a contribuição da própria p (mesmo motivo do fix\n    // acima: a célula-irmã do próprio strip não deve contar)\n    const adjInRoom = new Set();\n    for (const q of people){\n      if (q.id === p.id) continue;\n      if (scene.roomOf[q.cell[0]][q.cell[1]] !== roomId) continue;\n      for (const [r2,c2] of neighborsSameRoom(scene, q.cell[0], q.cell[1])){\n        const o2 = scene.obj[r2][c2];\n        if (o2 && o2 !== scene.obj[q.cell[0]][q.cell[1]]) adjInRoom.add(o2);\n      }\n    }\n    for (const k of adjInRoom)\n      pool.push({ pid:p.id, type:\"someoneInRoomAdj\", obj:k, peso:1 });\n\n    /* --- traços visuais (v2): óculos, barba --- */\n    const roomMates = people.filter(q => q.id !== p.id &&\n      scene.roomOf[q.cell[0]][q.cell[1]] === roomId);\n    if (roomMates.some(q => q.traits.oculos))\n      pool.push({ pid:p.id, type:\"traitSomeone\", trait:\"oculos\", peso:1 });\n    if (roomMates.some(q => q.traits.barba))\n      pool.push({ pid:p.id, type:\"traitSomeone\", trait:\"barba\", peso:1 });\n    if (roomMates.length >= 1 && p.traits.oculos && roomMates.every(q => q.traits.oculos))\n      pool.push({ pid:p.id, type:\"traitAll\", trait:\"oculos\", peso:2 });\n\n    /* --- composta (v2): \"exatamente K colunas a leste, alguém ao lado de X\" --- */\n    {\n      const combos = [];\n      for (const q of people){\n        const adj = new Set();\n        for (const [r2,c2] of neighborsSameRoom(scene, q.cell[0], q.cell[1])){\n          const o2 = scene.obj[r2][c2];\n          if (o2) adj.add(o2);\n        }\n        if (!adj.size) continue;\n        const dc = q.cell[1] - c, dr = q.cell[0] - r;\n        for (const o2 of adj){\n          if (dc !== 0 && Math.abs(dc) <= 2)\n            combos.push({ pid:p.id, type:\"colOffsetAdj\", axis:\"col\", k:dc, obj:o2, peso:1 });\n          if (dr !== 0 && Math.abs(dr) <= 2)\n            combos.push({ pid:p.id, type:\"colOffsetAdj\", axis:\"row\", k:dr, obj:o2, peso:1 });\n        }\n      }\n      for (const cb of shuffle(combos).slice(0, 2)) pool.push(cb);\n    }\n\n    /* --- relativo a pessoas --- */\n    for (const q of suspects){\n      if (q.id === p.id) continue;\n      if (r < q.cell[0]) pool.push({ pid:p.id, type:\"cardinal\", dir:\"N\", ref:q.id, peso:2 });\n      if (r > q.cell[0]) pool.push({ pid:p.id, type:\"cardinal\", dir:\"S\", ref:q.id, peso:2 });\n      if (c > q.cell[1]) pool.push({ pid:p.id, type:\"cardinal\", dir:\"E\", ref:q.id, peso:2 });\n      if (c < q.cell[1]) pool.push({ pid:p.id, type:\"cardinal\", dir:\"W\", ref:q.id, peso:2 });\n      const dr = Math.abs(r - q.cell[0]), dc = Math.abs(c - q.cell[1]);\n      if (dr === dc && dr > 0)\n        pool.push({ pid:p.id, type:\"diagPerson\", ref:q.id, peso:1 });\n    }\n  }\n\n  /* --- globais --- */\n  if (scene.rooms.every(rm => (countByRoom[rm.id] || 0) > 0))\n    pool.push({ pid:null, type:\"noEmptyRoom\", peso:1 });\n  // contagem (v2): \"havia exatamente N pessoas em <objeto ocupável>\"\n  {\n    const onCount = {};\n    for (const q of people){\n      const o = scene.obj[q.cell[0]][q.cell[1]];\n      if (o && OBJ[o].occ) onCount[o] = (onCount[o] || 0) + 1;\n    }\n    for (const [o,n] of Object.entries(onCount))\n      pool.push({ pid:null, type:\"countOnObj\", obj:o, n, peso:1 });\n  }\n\n  return applyTierWeights(pool, scene.N);\n}\n\nfunction clueText(clue, scene, people){\n  const p = clue.pid == null ? null : people.find(x => x.id === clue.pid);\n  const fem = p && p.genero === \"F\";\n  switch (clue.type){\n    case \"on\":\n      return `Estava ${occPhrase(clue.obj, fem)}.`;\n    case \"onNeg\":\n      return `Não estava ${clue.obj === \"tapete\" ? \"sobre um tapete\" : occPhrase(clue.obj, fem)}.`;\n    case \"onlyOnObj\":\n      return `Era a única pessoa ${occPhrase(clue.obj, true).replace(\"sentada\",\"sentada\")}.`;\n    case \"adjObj\":    return `Estava ao lado de ${objIndef(clue.obj)}.`;\n    case \"adjObjNeg\": return `Não estava ao lado de ${objIndef(clue.obj)}.`;\n    case \"window\":    return \"Estava em frente a uma janela.\";\n    case \"room\":      return `Estava ${roomLoc(scene.rooms[clue.roomId].nome)}.`;\n    case \"roomNeg\":   return `Não estava ${roomLoc(scene.rooms[clue.roomId].nome)}.`;\n    case \"rowIs\":\n      return `Estava na ${clue.row === scene.N - 1 ? \"última\" : ORD_F[clue.row]} linha.`;\n    case \"colIs\":\n      return `Estava na ${clue.col === scene.N - 1 ? \"última\" : ORD_F[clue.col]} coluna.`;\n    case \"corner\":     return \"Estava num canto do seu cômodo.\";\n    case \"wallAdjNeg\": return \"Não estava ao lado de uma parede.\";\n    case \"cardinalObj\":\n      return `Estava ${DIR8_TXT[clue.dir]} ${objDef(clue.obj)}${clue.sameRoom ? \", no mesmo cômodo\" : \"\"}.`;\n    case \"alone\":      return `Estava sozinh${fem?\"a\":\"o\"} no seu cômodo.`;\n    case \"aloneWith\": {\n      const q = people.find(x => x.id === clue.ref);\n      return `Estava sozinh${fem?\"a\":\"o\"} com ${artNome(q)}.`;\n    }\n    case \"aloneWithGender\":\n      return `Estava sozinh${fem?\"a\":\"o\"} com ${clue.g === \"F\" ? \"uma mulher\" : \"um homem\"}.`;\n    case \"sameRoomAs\": {\n      const q = people.find(x => x.id === clue.ref);\n      return `Estava no mesmo cômodo que ${artNome(q)}.`;\n    }\n    case \"genderRoom\":\n      return clue.g === \"F\" ? \"Havia uma mulher no seu cômodo.\" : \"Havia um homem no seu cômodo.\";\n    case \"genderRoomNeg\":\n      return clue.g === \"F\" ? \"Não havia nenhuma mulher no seu cômodo.\" : \"Não havia nenhum homem no seu cômodo.\";\n    case \"countGenderInRoom\":\n      return `Havia exatamente ${genderCountPhrase(clue.n, clue.g)} no seu cômodo.`;\n    case \"someoneInRoomAdj\":\n      return `Havia alguém no seu cômodo ao lado de ${objIndef(clue.obj)}.`;\n    case \"cardinal\": {\n      const q = people.find(x => x.id === clue.ref);\n      return `Estava ${DIR_TXT[clue.dir]} ${q.genero === \"F\" ? \"da\" : \"do\"} ${q.nome}.`;\n    }\n    case \"diagPerson\": {\n      const q = people.find(x => x.id === clue.ref);\n      return `Estava na mesma diagonal que ${artNome(q)}.`;\n    }\n    case \"traitSomeone\":\n      return clue.trait === \"barba\"\n        ? \"Havia um homem de barba no seu cômodo.\"\n        : \"Havia alguém de óculos no seu cômodo.\";\n    case \"traitAll\":\n      return \"Todas as pessoas no seu cômodo usavam óculos.\";\n    case \"colOffsetAdj\": {\n      const abs = Math.abs(clue.k);\n      const unit = clue.axis === \"col\" ? (abs === 1 ? \"uma coluna\" : \"duas colunas\")\n                                       : (abs === 1 ? \"uma linha\" : \"duas linhas\");\n      const dir = clue.axis === \"col\" ? (clue.k > 0 ? \"a leste\" : \"a oeste\")\n                                      : (clue.k > 0 ? \"ao sul\" : \"ao norte\");\n      return `Exatamente ${unit} ${dir} ${fem ? \"dela\" : \"dele\"}, havia alguém ao lado de ${objIndef(clue.obj)}.`;\n    }\n    case \"countOnObj\": {\n      const num = [\"\",\"uma pessoa\",\"duas pessoas\",\"três pessoas\",\"quatro pessoas\"][clue.n] || clue.n + \" pessoas\";\n      return `Havia exatamente ${num} ${occPhrase(clue.obj, true).replace(\"sentada \",\"\")}.`;\n    }\n    case \"noEmptyRoom\": return \"Não havia nenhum cômodo vazio.\";\n  }\n  return \"?\";\n}\n\n/* ============================================================\n   UNÁRIAS COMPARTILHADAS (solve + difficulty)\n============================================================ */\nfunction buildUnary(scene, people, clues, cluesByPid){\n  const winSet = windowCells(scene);\n  const objCells = {};\n  for (let r = 0; r < scene.N; r++)\n    for (let c = 0; c < scene.N; c++){\n      const o = scene.obj[r][c];\n      if (o && o !== \"__void\") (objCells[o] = objCells[o] || []).push([r,c]);\n    }\n  const forbidObj = {}; // \"única pessoa em X\" proíbe X aos demais\n  for (const cl of clues){\n    if (cl.type !== \"onlyOnObj\") continue;\n    for (const p of people)\n      if (p.id !== cl.pid)\n        (forbidObj[p.id] = forbidObj[p.id] || new Set()).add(cl.obj);\n  }\n  return function unaryOk(pid, r, c){\n    const fb = forbidObj[pid];\n    if (fb && fb.has(scene.obj[r][c])) return false;\n    for (const cl of (cluesByPid[pid] || [])){\n      switch (cl.type){\n        case \"on\":\n        case \"onlyOnObj\":\n          if (scene.obj[r][c] !== cl.obj) return false; break;\n        case \"onNeg\":\n          if (scene.obj[r][c] === cl.obj) return false; break;\n        case \"adjObj\": {\n          let ok = false;\n          for (const [r2,c2] of neighborsSameRoom(scene, r, c))\n            if (scene.obj[r2][c2] === cl.obj){ ok = true; break; }\n          if (!ok) return false; break;\n        }\n        case \"adjObjNeg\":\n          for (const [r2,c2] of neighborsSameRoom(scene, r, c))\n            if (scene.obj[r2][c2] === cl.obj) return false;\n          break;\n        case \"window\":\n          if (!winSet.has(r + \",\" + c)) return false; break;\n        case \"room\":\n          if (scene.roomOf[r][c] !== cl.roomId) return false; break;\n        case \"roomNeg\":\n          if (scene.roomOf[r][c] === cl.roomId) return false; break;\n        case \"rowIs\":\n          if (r !== cl.row) return false; break;\n        case \"colIs\":\n          if (c !== cl.col) return false; break;\n        case \"corner\":\n          if (!isRoomCorner(scene, r, c)) return false; break;\n        case \"wallAdjNeg\":\n          if (neighborsSameRoom(scene, r, c).length !== 4) return false; break;\n        case \"cardinalObj\": {\n          const cellO = (objCells[cl.obj] || [])[0];\n          if (!cellO) return false;\n          const [ro,co] = cellO;\n          if (cl.dir.includes(\"N\") && !(r < ro)) return false;\n          if (cl.dir.includes(\"S\") && !(r > ro)) return false;\n          if (cl.dir.includes(\"E\") && !(c > co)) return false;\n          if (cl.dir.includes(\"W\") && !(c < co)) return false;\n          if (cl.sameRoom && scene.roomOf[ro][co] !== scene.roomOf[r][c]) return false;\n          break;\n        }\n      }\n    }\n    return true;\n  };\n}\n\n/* ============================================================\n   SOLVER\n   - unárias filtram candidatos\n   - cardinais podadas quando ambos fixos\n   - alone / genderRoom / vítima-com-assassino checadas na folha\n   Conta soluções (limite 2). Retorna {count, nodes, solution}\n============================================================ */\nfunction solve(scene, people, clues, opts){\n  opts = opts || {};\n  const N = scene.N;\n  const winSet = windowCells(scene);\n  const freeCells = [];\n  for (let r = 0; r < N; r++)\n    for (let c = 0; c < N; c++)\n      if (cellFree(scene.obj, r, c)) freeCells.push([r,c]);\n\n  const cluesByPid = {};\n  for (const cl of clues) (cluesByPid[cl.pid] = cluesByPid[cl.pid] || []).push(cl);\n  const globalClues = clues.filter(cl => cl.pid == null);\n  const unaryOk = buildUnary(scene, people, clues, cluesByPid);\n\n  // candidatos iniciais\n  const cand = people.map(p =>\n    freeCells.filter(([r,c]) => unaryOk(p.id, r, c))\n  );\n  if (cand.some(cs => cs.length === 0)) return { count:0, nodes:0, solution:null, solutions:[], capped:false };\n\n  const assign = Array(people.length).fill(null);\n  const usedR = new Set(), usedC = new Set();\n  let count = 0, nodes = 0;\n  const solutions = [];\n  const NODE_CAP = (opts && opts.cap) || 400000;\n\n  // --- estado incremental por sala (poda cedo, não só na folha) ---\n  const nRooms = scene.rooms.length;\n  const roomCount = Array(nRooms).fill(0);   // pessoas já postas na sala\n  const roomAlone = Array(nRooms).fill(false); // sala reivindicada por \"sozinho\"\n  const capClaims = Array(nRooms).fill(0);   // reivindicações de \"no máx. 2\"\n  const victimIdx = people.findIndex(p => p.isVictim);\n  const aloneOf = people.map(p =>\n    (cluesByPid[p.id] || []).some(cl => cl.type === \"alone\"));\n  // vítima e quem diz \"a sós com alguém\" limitam a própria sala a 2 pessoas\n  const capperOf = people.map((p,i) =>\n    i === victimIdx ||\n    (cluesByPid[p.id] || []).some(cl =>\n      cl.type === \"aloneWith\" || cl.type === \"aloneWithGender\"));\n  let victimRoom = -1;\n\n  function roomOkToPlace(i, roomId){\n    if (aloneOf[i] && roomCount[roomId] > 0) return false;\n    if (roomAlone[roomId]) return false;\n    if (capClaims[roomId] > 0 && roomCount[roomId] >= 2) return false;\n    if (capperOf[i] && roomCount[roomId] >= 2) return false;\n    return true;\n  }\n  function place(i, roomId){\n    roomCount[roomId]++;\n    if (aloneOf[i]) roomAlone[roomId] = true;\n    if (capperOf[i]) capClaims[roomId]++;\n    if (i === victimIdx) victimRoom = roomId;\n  }\n  function unplace(i, roomId){\n    roomCount[roomId]--;\n    if (aloneOf[i]) roomAlone[roomId] = false;\n    if (capperOf[i]) capClaims[roomId]--;\n    if (i === victimIdx) victimRoom = -1;\n  }\n\n  const pidToIdx = {}; people.forEach((p,i) => pidToIdx[p.id] = i);\n\n  function cardinalOkPartial(pid, r, c){\n    const myIdx = pidToIdx[pid];\n    const myRoom = scene.roomOf[r][c];\n    for (const cl of (cluesByPid[pid] || [])){\n      const otherIdx = cl.ref != null ? pidToIdx[cl.ref] : -1;\n      const other = otherIdx >= 0 ? assign[otherIdx] : null;\n      if (!other) continue;\n      if (cl.type === \"cardinal\" && !cardCheck(cl.dir, [r,c], other)) return false;\n      if (cl.type === \"diagPerson\" &&\n          (Math.abs(r - other[0]) !== Math.abs(c - other[1]) || r === other[0])) return false;\n      if ((cl.type === \"sameRoomAs\" || cl.type === \"aloneWith\") &&\n          scene.roomOf[other[0]][other[1]] !== myRoom) return false;\n    }\n    // e o inverso: pistas de outros que referenciam pid\n    for (let i = 0; i < people.length; i++){\n      if (!assign[i] || i === myIdx) continue;\n      for (const cl of (cluesByPid[people[i].id] || [])){\n        if (cl.ref !== pid) continue;\n        if (cl.type === \"cardinal\" && !cardCheck(cl.dir, assign[i], [r,c])) return false;\n        if (cl.type === \"diagPerson\" &&\n            (Math.abs(assign[i][0] - r) !== Math.abs(assign[i][1] - c) || assign[i][0] === r)) return false;\n        if ((cl.type === \"sameRoomAs\" || cl.type === \"aloneWith\") &&\n            scene.roomOf[assign[i][0]][assign[i][1]] !== myRoom) return false;\n      }\n    }\n    return true;\n  }\n  function cardCheck(dir, me, other){\n    if (dir === \"N\") return me[0] < other[0];\n    if (dir === \"S\") return me[0] > other[0];\n    if (dir === \"E\") return me[1] > other[1];\n    if (dir === \"W\") return me[1] < other[1];\n    return true;\n  }\n\n  function leafOk(){\n    if (roomCount[victimRoom] !== 2) return false;\n    for (const gcl of globalClues){\n      if (gcl.type === \"noEmptyRoom\" &&\n          !roomCount.every(x => x > 0)) return false;\n      if (gcl.type === \"countOnObj\"){\n        let n = 0;\n        for (let i = 0; i < people.length; i++){\n          const [r,c] = assign[i];\n          if (scene.obj[r][c] === gcl.obj) n++;\n        }\n        if (n !== gcl.n) return false;\n      }\n    }\n    for (const p of people){\n      const idx = pidToIdx[p.id];\n      const [r,c] = assign[idx];\n      const roomId = scene.roomOf[r][c];\n      for (const cl of (cluesByPid[p.id] || [])){\n        switch (cl.type){\n          case \"genderRoom\": {\n            const ok = people.some(q => q.id !== p.id && q.genero === cl.g &&\n              scene.roomOf[assign[pidToIdx[q.id]][0]][assign[pidToIdx[q.id]][1]] === roomId);\n            if (!ok) return false; break;\n          }\n          case \"genderRoomNeg\": {\n            const bad = people.some(q => q.id !== p.id && q.genero === cl.g &&\n              scene.roomOf[assign[pidToIdx[q.id]][0]][assign[pidToIdx[q.id]][1]] === roomId);\n            if (bad) return false; break;\n          }\n          case \"countGenderInRoom\": {\n            let n = 0;\n            for (const q of people){\n              if (q.id === p.id) continue;\n              const qc = assign[pidToIdx[q.id]];\n              if (q.genero === cl.g && scene.roomOf[qc[0]][qc[1]] === roomId) n++;\n            }\n            if (n !== cl.n) return false; break;\n          }\n          case \"aloneWith\": {\n            if (roomCount[roomId] !== 2) return false;\n            const oc = assign[pidToIdx[cl.ref]];\n            if (scene.roomOf[oc[0]][oc[1]] !== roomId) return false;\n            break;\n          }\n          case \"aloneWithGender\": {\n            if (roomCount[roomId] !== 2) return false;\n            const other = people.find(q => q.id !== p.id &&\n              scene.roomOf[assign[pidToIdx[q.id]][0]][assign[pidToIdx[q.id]][1]] === roomId);\n            if (!other || other.genero !== cl.g) return false;\n            break;\n          }\n          case \"someoneInRoomAdj\": {\n            const ok = people.some(q => {\n              const qc = assign[pidToIdx[q.id]];\n              if (scene.roomOf[qc[0]][qc[1]] !== roomId) return false;\n              return neighborsSameRoom(scene, qc[0], qc[1])\n                .some(([r2,c2]) => scene.obj[r2][c2] === cl.obj);\n            });\n            if (!ok) return false; break;\n          }\n          case \"traitSomeone\": {\n            const ok = people.some(q => {\n              if (q.id === p.id) return false;\n              const qc = assign[pidToIdx[q.id]];\n              if (scene.roomOf[qc[0]][qc[1]] !== roomId) return false;\n              return cl.trait === \"barba\" ? q.traits.barba : q.traits.oculos;\n            });\n            if (!ok) return false; break;\n          }\n          case \"traitAll\": {\n            if (!p.traits.oculos) return false;\n            let mates = 0;\n            for (const q of people){\n              if (q.id === p.id) continue;\n              const qc = assign[pidToIdx[q.id]];\n              if (scene.roomOf[qc[0]][qc[1]] !== roomId) continue;\n              mates++;\n              if (!q.traits.oculos) return false;\n            }\n            if (!mates) return false; break;\n          }\n          case \"colOffsetAdj\": {\n            const ok = people.some(q => {\n              const qc = assign[pidToIdx[q.id]];\n              const off = cl.axis === \"col\" ? qc[1] - c : qc[0] - r;\n              if (off !== cl.k) return false;\n              return neighborsSameRoom(scene, qc[0], qc[1])\n                .some(([r2,c2]) => scene.obj[r2][c2] === cl.obj);\n            });\n            if (!ok) return false; break;\n          }\n        }\n      }\n    }\n    return true;\n  }\n\n  // --- PROPAGAÇÃO: encolhe domínios antes da busca ---\n  // movimentos forçados pertencem a toda solução, logo a contagem\n  // de soluções não muda — só o custo da prova de unicidade despenca\n  function propagate(){\n    let changed = true, guard = 0;\n    while (changed && guard++ < 300){\n      changed = false;\n      // remove candidatos inválidos (linha/coluna usada, sala vetada, cardinal)\n      for (let i = 0; i < people.length; i++){\n        if (assign[i]) continue;\n        const before = cand[i].length;\n        cand[i] = cand[i].filter(([r,c]) =>\n          !usedR.has(r) && !usedC.has(c) &&\n          roomOkToPlace(i, scene.roomOf[r][c]) &&\n          cardinalOkPartial(people[i].id, r, c));\n        if (!cand[i].length) return false;\n        if (cand[i].length !== before) changed = true;\n        // naked single: força\n        if (cand[i].length === 1){\n          const [r,c] = cand[i][0];\n          assign[i] = [r,c]; usedR.add(r); usedC.add(c);\n          place(i, scene.roomOf[r][c]);\n          changed = true;\n        }\n      }\n      // hidden single por linha e coluna\n      for (let r = 0; r < scene.N; r++){\n        if (usedR.has(r)) continue;\n        let hit = null, many = false;\n        for (let i = 0; i < people.length && !many; i++){\n          if (assign[i]) continue;\n          for (const cell of cand[i]){\n            if (cell[0] !== r) continue;\n            if (hit && (hit[0] !== i || hit[1][1] !== cell[1])){ many = true; break; }\n            hit = [i, cell];\n          }\n        }\n        if (!many && hit){\n          const [i,[rr,cc]] = hit;\n          if (!usedC.has(cc) && roomOkToPlace(i, scene.roomOf[rr][cc])){\n            assign[i] = [rr,cc]; usedR.add(rr); usedC.add(cc);\n            place(i, scene.roomOf[rr][cc]);\n            cand[i] = [[rr,cc]];\n            changed = true;\n          } else return false;\n        }\n        if (!many && !hit) return false; // linha sem candidato\n      }\n      for (let c = 0; c < scene.N; c++){\n        if (usedC.has(c)) continue;\n        let hit = null, many = false;\n        for (let i = 0; i < people.length && !many; i++){\n          if (assign[i]) continue;\n          for (const cell of cand[i]){\n            if (cell[1] !== c) continue;\n            if (hit && (hit[0] !== i || hit[1][0] !== cell[0])){ many = true; break; }\n            hit = [i, cell];\n          }\n        }\n        if (!many && hit){\n          const [i,[rr,cc]] = hit;\n          if (!usedR.has(rr) && roomOkToPlace(i, scene.roomOf[rr][cc])){\n            assign[i] = [rr,cc]; usedR.add(rr); usedC.add(cc);\n            place(i, scene.roomOf[rr][cc]);\n            cand[i] = [[rr,cc]];\n            changed = true;\n          } else return false;\n        }\n        if (!many && !hit) return false;\n      }\n    }\n    return true;\n  }\n\n  if (!propagate()) return { count:0, nodes:0, solution:null, solutions:[], capped:false };\n\n  function bt(){\n    if (nodes > NODE_CAP) return;\n    // MRV: pessoa não atribuída com menos candidatos viáveis\n    let best = -1, bestList = null;\n    for (let i = 0; i < people.length; i++){\n      if (assign[i]) continue;\n      const list = cand[i].filter(([r,c]) =>\n        !usedR.has(r) && !usedC.has(c) &&\n        roomOkToPlace(i, scene.roomOf[r][c]) &&\n        cardinalOkPartial(people[i].id, r, c));\n      if (!list.length) return;\n      if (!bestList || list.length < bestList.length){ best = i; bestList = list; }\n      if (list.length === 1) break;\n    }\n    if (best === -1){\n      if (leafOk()){\n        count++;\n        if (solutions.length < 2) solutions.push(assign.map(x => x.slice()));\n      }\n      return;\n    }\n    for (const [r,c] of bestList){\n      nodes++;\n      const roomId = scene.roomOf[r][c];\n      if (!roomOkToPlace(best, roomId)) continue; // estado pode ter mudado\n      assign[best] = [r,c]; usedR.add(r); usedC.add(c); place(best, roomId);\n      bt();\n      assign[best] = null; usedR.delete(r); usedC.delete(c); unplace(best, roomId);\n      if (count >= 2) return;\n    }\n  }\n  bt();\n  return { count, nodes, solution: solutions[0] || null, solutions, capped: nodes > NODE_CAP };\n}\n\n/* ============================================================\n   SELEÇÃO DE PISTAS\n   estratégia: 1 pista por suspeito -> adiciona extras até\n   solução única -> minimiza removendo redundantes\n   (todas as pistas do pool são verdadeiras, logo count >= 1 sempre)\n============================================================ */\nfunction clueKey(cl){\n  return [cl.pid, cl.type, cl.obj || \"\", cl.roomId ?? \"\", cl.g || \"\", cl.dir || \"\", cl.ref ?? \"\"].join(\"|\");\n}\nfunction weightedPick(list){\n  const tot = list.reduce((s,x) => s + x.peso, 0);\n  let x = rnd() * tot;\n  for (const it of list){ x -= it.peso; if (x <= 0) return it; }\n  return list[list.length - 1];\n}\n\n/* avalia uma pista contra uma atribuição arbitrária (array de [r,c] por pessoa) */\nfunction evalClue(scene, people, cl, assign){\n  const winSet = windowCells(scene);\n  if (cl.type === \"noEmptyRoom\")\n    return scene.rooms.every(rm => people.some(q =>\n      scene.roomOf[assign[q.id][0]][assign[q.id][1]] === rm.id));\n  if (cl.type === \"countOnObj\")\n    return people.filter(q =>\n      scene.obj[assign[q.id][0]][assign[q.id][1]] === cl.obj).length === cl.n;\n\n  const [r,c] = assign[cl.pid];\n  const myRoom = scene.roomOf[r][c];\n  const inMyRoom = q => scene.roomOf[assign[q.id][0]][assign[q.id][1]] === myRoom;\n  switch (cl.type){\n    case \"on\":        return scene.obj[r][c] === cl.obj;\n    case \"onNeg\":     return scene.obj[r][c] !== cl.obj;\n    case \"onlyOnObj\":\n      return scene.obj[r][c] === cl.obj && !people.some(q =>\n        q.id !== cl.pid && scene.obj[assign[q.id][0]][assign[q.id][1]] === cl.obj);\n    case \"adjObj\":\n      return neighborsSameRoom(scene, r, c).some(([r2,c2]) => scene.obj[r2][c2] === cl.obj);\n    case \"adjObjNeg\":\n      return !neighborsSameRoom(scene, r, c).some(([r2,c2]) => scene.obj[r2][c2] === cl.obj);\n    case \"window\":     return winSet.has(r + \",\" + c);\n    case \"room\":       return myRoom === cl.roomId;\n    case \"roomNeg\":    return myRoom !== cl.roomId;\n    case \"rowIs\":      return r === cl.row;\n    case \"colIs\":      return c === cl.col;\n    case \"corner\":     return isRoomCorner(scene, r, c);\n    case \"wallAdjNeg\": return neighborsSameRoom(scene, r, c).length === 4;\n    case \"cardinalObj\": {\n      // instância única garantida na geração\n      let cellO = null;\n      for (let rr = 0; rr < scene.N && !cellO; rr++)\n        for (let cc = 0; cc < scene.N; cc++)\n          if (scene.obj[rr][cc] === cl.obj){ cellO = [rr,cc]; break; }\n      if (!cellO) return false;\n      const [ro,co] = cellO;\n      if (cl.dir.includes(\"N\") && !(r < ro)) return false;\n      if (cl.dir.includes(\"S\") && !(r > ro)) return false;\n      if (cl.dir.includes(\"E\") && !(c > co)) return false;\n      if (cl.dir.includes(\"W\") && !(c < co)) return false;\n      if (cl.sameRoom && scene.roomOf[ro][co] !== myRoom) return false;\n      return true;\n    }\n    case \"alone\":\n      return !people.some(q => q.id !== cl.pid && inMyRoom(q));\n    case \"aloneWith\": {\n      const others = people.filter(q => q.id !== cl.pid && inMyRoom(q));\n      return others.length === 1 && others[0].id === cl.ref;\n    }\n    case \"aloneWithGender\": {\n      const others = people.filter(q => q.id !== cl.pid && inMyRoom(q));\n      return others.length === 1 && others[0].genero === cl.g;\n    }\n    case \"sameRoomAs\":\n      return scene.roomOf[assign[cl.ref][0]][assign[cl.ref][1]] === myRoom;\n    case \"genderRoom\":\n      return people.some(q => q.id !== cl.pid && q.genero === cl.g && inMyRoom(q));\n    case \"genderRoomNeg\":\n      return !people.some(q => q.id !== cl.pid && q.genero === cl.g && inMyRoom(q));\n    case \"countGenderInRoom\":\n      return people.filter(q => q.id !== cl.pid && q.genero === cl.g && inMyRoom(q)).length === cl.n;\n    case \"someoneInRoomAdj\":\n      return people.some(q => inMyRoom(q) &&\n        neighborsSameRoom(scene, assign[q.id][0], assign[q.id][1])\n          .some(([r2,c2]) => scene.obj[r2][c2] === cl.obj));\n    case \"traitSomeone\":\n      return people.some(q => q.id !== cl.pid && inMyRoom(q) &&\n        (cl.trait === \"barba\" ? q.traits.barba : q.traits.oculos));\n    case \"traitAll\": {\n      const me = people.find(q => q.id === cl.pid);\n      if (!me.traits.oculos) return false;\n      const mates = people.filter(q => q.id !== cl.pid && inMyRoom(q));\n      return mates.length >= 1 && mates.every(q => q.traits.oculos);\n    }\n    case \"colOffsetAdj\":\n      return people.some(q => {\n        const [qr,qc] = assign[q.id];\n        const off = cl.axis === \"col\" ? qc - c : qr - r;\n        if (off !== cl.k) return false;\n        return neighborsSameRoom(scene, qr, qc)\n          .some(([r2,c2]) => scene.obj[r2][c2] === cl.obj);\n      });\n    case \"cardinal\": {\n      const o = assign[cl.ref];\n      if (cl.dir === \"N\") return r < o[0];\n      if (cl.dir === \"S\") return r > o[0];\n      if (cl.dir === \"E\") return c > o[1];\n      if (cl.dir === \"W\") return c < o[1];\n      return false;\n    }\n    case \"diagPerson\": {\n      const o = assign[cl.ref];\n      return Math.abs(r - o[0]) === Math.abs(c - o[1]) && r !== o[0];\n    }\n  }\n  return false;\n}\n\nfunction selectClues(scene, people, pool, opts){\n  opts = opts || {};\n  const restarts = opts.restarts || 4;\n  const keepLogic = !!opts.keepLogic; // minimiza sem perder solvabilidade humana\n  const selCap = opts.selCap || 20000; // cap DURANTE a seleção — deliberadamente\n  // menor que a verificação final: se uma combinação de pistas não prova\n  // unicidade rápido, é sinal de que ela não afunila bem a busca, então\n  // vale mais desistir cedo e tentar outra combinação do que insistir\n  // numa busca cara repetidamente (ver stallCount abaixo).\n  const timeBudgetMs = opts.timeBudgetMs || 2000; // por tentativa (restart)\n  const suspects = people.filter(p => !p.isVictim);\n  const truth = people.map(p => p.cell); // atribuição verdadeira, indexada por id\n  const byPid = {};\n  for (const cl of pool) (byPid[cl.pid] = byPid[cl.pid] || []).push(cl);\n  for (const s of suspects) if (!byPid[s.id] || !byPid[s.id].length) return null;\n\n  let calls = 0;\n  for (let t = 0; t < restarts; t++){\n    const restartStart = Date.now();\n    // base: 1 pista-ÂNCORA por suspeito (evita tipos \"fracos\" — ver\n    // WEAK_CLUE_TYPES). Isso garante que o solver sempre comece com\n    // restrições fortes, mesmo em mapas grandes onde o peso favorece\n    // muito as pistas avançadas.\n    const set = suspects.map(s => {\n      const anchors = byPid[s.id].filter(cl => !WEAK_CLUE_TYPES.has(cl.type));\n      return weightedPick(anchors.length ? anchors : byPid[s.id]);\n    });\n    const inSet = new Set(set.map(clueKey));\n    calls++;\n    let res = solve(scene, people, set, { cap: selCap });\n\n    // extras guiados por contraexemplo: cada pista adicionada precisa\n    // ser falsa na solução alternativa encontrada, eliminando-a.\n    // Entre os candidatos que eliminam a alternativa, preferimos os que\n    // TAMBÉM podam a busca (não-fracos) — assim cada pista extra não só\n    // resolve a unicidade lógica como afunila o solver, mantendo as\n    // chamadas seguintes rápidas. Só recorremos a um tipo fraco se\n    // nenhum candidato forte eliminar a alternativa.\n    const SEL_CAP = { cap: selCap };\n    const rankKiller = (a,b) => {\n      const wa = WEAK_CLUE_TYPES.has(a.type) ? 1 : 0, wb = WEAK_CLUE_TYPES.has(b.type) ? 1 : 0;\n      return (wa - wb) || (b.peso - a.peso);\n    };\n    let guard = 0, stuck = false, timedOut = false, stallCount = 0;\n    while ((res.count > 1 || res.capped) && guard++ < people.length * 6){\n      // estagnação: se a busca continua batendo perto do teto de nós\n      // mesmo após adicionar pistas, essa combinação não está afunilando\n      // — desiste deste restart e tenta outra combinação de âncoras\n      if (res.capped && res.nodes >= selCap * 0.9) stallCount++; else stallCount = 0;\n      if (stallCount >= 3){ stuck = true; break; }\n      if (Date.now() - restartStart > timeBudgetMs){ timedOut = true; break; }\n      const alt = res.solutions[1];\n      let cl;\n      if (alt){\n        const killers = shuffle(pool.filter(x =>\n          !inSet.has(clueKey(x)) && !evalClue(scene, people, x, alt)))\n          .sort(rankKiller);\n        cl = killers[0];\n      } else {\n        cl = shuffle(pool.filter(x => !inSet.has(clueKey(x))))\n          .sort(rankKiller)[0];\n      }\n      if (!cl){ stuck = true; break; }\n      set.push(cl); inSet.add(clueKey(cl));\n      calls++;\n      res = solve(scene, people, set, SEL_CAP);\n    }\n    if (res.count !== 1 || res.capped || stuck || timedOut) continue;\n\n    // keepLogic: se a propagação humana trava, adiciona pistas fortes\n    // para pessoas ainda indefinidas até destravar (contagem continua 1,\n    // pois pistas verdadeiras nunca criam soluções novas)\n    if (keepLogic){\n      let dGuard = 0, d = difficulty(scene, people, set);\n      while (!d.logicOnly && dGuard++ < people.length * 3){\n        const targets = new Set(d.unfixedIds);\n        const cl = shuffle(pool.filter(x =>\n          !inSet.has(clueKey(x)) && targets.has(x.pid)))\n          .sort((a,b) => b.peso - a.peso)[0];\n        if (!cl) break;\n        set.push(cl); inSet.add(clueKey(cl));\n        d = difficulty(scene, people, set);\n      }\n      if (!d.logicOnly) continue;\n    }\n\n    // minimiza: remove pistas mantendo unicidade\n    // (e, se keepLogic, mantendo solvabilidade por propagação)\n    let final = set.slice();\n    let budget = people.length * 3; // limite de tentativas de remoção\n    for (const cl of shuffle(set)){\n      if (budget-- <= 0) break;\n      const remaining = final.filter(x => x !== cl);\n      if (cl.pid != null && !remaining.some(x => x.pid === cl.pid)) continue; // >=1 pista por suspeito (globais podem sair)\n      calls++;\n      const r2 = solve(scene, people, remaining, { cap: selCap });\n      if (r2.count !== 1 || r2.capped) continue;\n      if (keepLogic && !difficulty(scene, people, remaining).logicOnly) continue;\n      final = remaining;\n    }\n    return { clues: final, solverCalls: calls };\n  }\n  return null;\n}\n\n/* ============================================================\n   DIFICULDADE (heurística): propagação pura resolve?\n   - filtra unárias, elimina linha/coluna de pessoas fixas,\n     aplica singles; se travar sem terminar => exige bifurcação\n============================================================ */\nfunction difficulty(scene, people, clues){\n  const N = scene.N;\n  const winSet = windowCells(scene);\n  const freeCells = [];\n  for (let r = 0; r < N; r++)\n    for (let c = 0; c < N; c++)\n      if (cellFree(scene.obj, r, c)) freeCells.push([r,c]);\n\n  const cluesByPid = {};\n  for (const cl of clues) (cluesByPid[cl.pid] = cluesByPid[cl.pid] || []).push(cl);\n  const unaryOk = buildUnary(scene, people, clues, cluesByPid);\n\n  const cand = people.map(p => freeCells.filter(([r,c]) => unaryOk(p.id, r, c)));\n  const fixed = Array(people.length).fill(null);\n  const pidIndex = {}; people.forEach((p,i) => pidIndex[p.id] = i);\n  let steps = 0, changed = true, guard = 0;\n\n  function fix(i, cell){\n    fixed[i] = cell; steps++; changed = true;\n    const [fr,fc] = cell;\n    for (let j = 0; j < people.length; j++){\n      if (j === i || fixed[j]) continue;\n      cand[j] = cand[j].filter(([r,c]) => r !== fr && c !== fc);\n    }\n  }\n\n  while (changed && guard++ < 200){\n    changed = false;\n\n    // 1) naked single\n    for (let i = 0; i < people.length; i++){\n      if (!fixed[i] && cand[i].length === 1) fix(i, cand[i][0]);\n    }\n\n    // 2) hidden single por linha e por coluna\n    //    (cada linha e cada coluna contém exatamente uma pessoa)\n    for (let r = 0; r < N; r++){\n      const hits = [];\n      for (let i = 0; i < people.length; i++){\n        if (fixed[i]){ if (fixed[i][0] === r) hits.length = 0, hits.push(null); continue; }\n        for (const cell of cand[i]) if (cell[0] === r) hits.push([i, cell]);\n      }\n      if (hits.length === 1 && hits[0]) fix(hits[0][0], hits[0][1]);\n    }\n    for (let c = 0; c < N; c++){\n      const hits = [];\n      for (let i = 0; i < people.length; i++){\n        if (fixed[i]){ if (fixed[i][1] === c) hits.length = 0, hits.push(null); continue; }\n        for (const cell of cand[i]) if (cell[1] === c) hits.push([i, cell]);\n      }\n      if (hits.length === 1 && hits[0]) fix(hits[0][0], hits[0][1]);\n    }\n\n    // 3) intersecção: se todos os candidatos de alguém estão numa só\n    //    linha/coluna, ninguém mais pode usá-la\n    for (let i = 0; i < people.length; i++){\n      if (fixed[i] || !cand[i].length) continue;\n      const rowsU = new Set(cand[i].map(x => x[0]));\n      const colsU = new Set(cand[i].map(x => x[1]));\n      if (rowsU.size === 1){\n        const r = [...rowsU][0];\n        for (let j = 0; j < people.length; j++){\n          if (j === i || fixed[j]) continue;\n          const before = cand[j].length;\n          cand[j] = cand[j].filter(x => x[0] !== r);\n          if (cand[j].length !== before) changed = true;\n        }\n      }\n      if (colsU.size === 1){\n        const c = [...colsU][0];\n        for (let j = 0; j < people.length; j++){\n          if (j === i || fixed[j]) continue;\n          const before = cand[j].length;\n          cand[j] = cand[j].filter(x => x[1] !== c);\n          if (cand[j].length !== before) changed = true;\n        }\n      }\n    }\n\n    // 4) poda cardinal por limites (funciona mesmo sem ninguém fixo)\n    for (let i = 0; i < people.length; i++){\n      if (fixed[i]) continue;\n      for (const cl of (cluesByPid[people[i].id] || [])){\n        if (cl.type !== \"cardinal\") continue;\n        const j = pidIndex[cl.ref];\n        const other = fixed[j] ? [fixed[j]] : cand[j];\n        if (!other.length) continue;\n        const before = cand[i].length;\n        if (cl.dir === \"N\"){\n          const m = Math.max(...other.map(x => x[0]));\n          cand[i] = cand[i].filter(x => x[0] < m);\n        }\n        if (cl.dir === \"S\"){\n          const m = Math.min(...other.map(x => x[0]));\n          cand[i] = cand[i].filter(x => x[0] > m);\n        }\n        if (cl.dir === \"E\"){\n          const m = Math.min(...other.map(x => x[1]));\n          cand[i] = cand[i].filter(x => x[1] > m);\n        }\n        if (cl.dir === \"W\"){\n          const m = Math.max(...other.map(x => x[1]));\n          cand[i] = cand[i].filter(x => x[1] < m);\n        }\n        if (cand[i].length !== before) changed = true;\n        // e no sentido inverso, restringe o referenciado\n        const meCells = fixed[i] ? [fixed[i]] : cand[i];\n        if (meCells.length && !fixed[j]){\n          const beforeJ = cand[j].length;\n          if (cl.dir === \"N\"){\n            const m = Math.min(...meCells.map(x => x[0]));\n            cand[j] = cand[j].filter(x => x[0] > m);\n          }\n          if (cl.dir === \"S\"){\n            const m = Math.max(...meCells.map(x => x[0]));\n            cand[j] = cand[j].filter(x => x[0] < m);\n          }\n          if (cl.dir === \"E\"){\n            const m = Math.max(...meCells.map(x => x[1]));\n            cand[j] = cand[j].filter(x => x[1] < m);\n          }\n          if (cl.dir === \"W\"){\n            const m = Math.min(...meCells.map(x => x[1]));\n            cand[j] = cand[j].filter(x => x[1] > m);\n          }\n          if (cand[j].length !== beforeJ) changed = true;\n        }\n      }\n    }\n\n    // 4b) social + diagonal quando um dos lados está fixo\n    for (let i = 0; i < people.length; i++){\n      for (const cl of (cluesByPid[people[i].id] || [])){\n        if (cl.ref == null) continue;\n        const j = pidIndex[cl.ref];\n        // eu fixo -> restringe o outro; outro fixo -> restringe a mim\n        const applyRoom = (from, to) => {\n          if (!fixed[from] || fixed[to]) return;\n          const rm = scene.roomOf[fixed[from][0]][fixed[from][1]];\n          const before = cand[to].length;\n          cand[to] = cand[to].filter(([r,c]) => scene.roomOf[r][c] === rm);\n          if (cand[to].length !== before) changed = true;\n        };\n        const applyDiag = (from, to) => {\n          if (!fixed[from] || fixed[to]) return;\n          const [fr,fc] = fixed[from];\n          const before = cand[to].length;\n          cand[to] = cand[to].filter(([r,c]) =>\n            Math.abs(r - fr) === Math.abs(c - fc) && r !== fr);\n          if (cand[to].length !== before) changed = true;\n        };\n        if (cl.type === \"sameRoomAs\" || cl.type === \"aloneWith\"){\n          applyRoom(i, j); applyRoom(j, i);\n          // aloneWith: sala fechada p/ terceiros quando o dono está fixo\n          if (cl.type === \"aloneWith\" && fixed[i]){\n            const rm = scene.roomOf[fixed[i][0]][fixed[i][1]];\n            for (let k = 0; k < people.length; k++){\n              if (k === i || k === j || fixed[k]) continue;\n              const before = cand[k].length;\n              cand[k] = cand[k].filter(([r,c]) => scene.roomOf[r][c] !== rm);\n              if (cand[k].length !== before) changed = true;\n            }\n          }\n        }\n        if (cl.type === \"diagPerson\"){ applyDiag(i, j); applyDiag(j, i); }\n      }\n    }\n\n    // 5) \"sozinho na divisão\": remove candidatos em salas onde\n    //    outra pessoa já está fixa (e vice-versa)\n    for (let i = 0; i < people.length; i++){\n      const hasAlone = (cluesByPid[people[i].id] || []).some(cl => cl.type === \"alone\");\n      if (!hasAlone) continue;\n      const fixedRooms = new Set();\n      for (let j = 0; j < people.length; j++)\n        if (j !== i && fixed[j]) fixedRooms.add(scene.roomOf[fixed[j][0]][fixed[j][1]]);\n      if (!fixed[i]){\n        const before = cand[i].length;\n        cand[i] = cand[i].filter(([r,c]) => !fixedRooms.has(scene.roomOf[r][c]));\n        if (cand[i].length !== before) changed = true;\n      } else {\n        const myRoom = scene.roomOf[fixed[i][0]][fixed[i][1]];\n        for (let j = 0; j < people.length; j++){\n          if (j === i || fixed[j]) continue;\n          const before = cand[j].length;\n          cand[j] = cand[j].filter(([r,c]) => scene.roomOf[r][c] !== myRoom);\n          if (cand[j].length !== before) changed = true;\n        }\n      }\n    }\n  }\n  const done = fixed.every(x => x);\n  const unfixedIds = people.filter((p,i) => !fixed[i]).map(p => p.id);\n  return { logicOnly: done, steps, unfixedIds };\n}\n\n/* ============================================================\n   GERADOR PRINCIPAL\n============================================================ */\nfunction generateCase(N, seedStr, wantDiff /* \"any\"|\"logic\"|\"hard\" */){\n  wantDiff = wantDiff || \"any\";\n  const seed = seedStr && seedStr.trim() ? hashSeed(seedStr.trim()) : (Math.random() * 2**31) | 0 || 1;\n  RNG = mulberry32(seed);\n\n  // orçamento total de geração: mapas grandes com dificuldade \"lógica\"\n  // podem, em casos raros, nunca convergir para uma solução 100%\n  // propagável (as pistas avançadas são propositalmente mais duras).\n  // Em vez de insistir indefinidamente, paramos no prazo e devolvemos\n  // o melhor caso válido já encontrado (ainda com solução única e\n  // provada — só não necessariamente resolvível sem nenhum palpite).\n  const deadline = Date.now() + (N >= 10 ? 9000 : (N >= 8 ? 5000 : 3000));\n  const wantLogic = wantDiff === \"logic\";\n\n  let fallback = null;\n  for (let attempt = 1; attempt <= 120; attempt++){\n    const remain = deadline - Date.now();\n    if (remain <= 0 && (fallback || attempt > 15)) break;\n    const scene = generateScene(N);\n    if (!scene) continue;\n    const people = placePeople(scene);\n    if (!people) continue;\n    const pool = genCluePool(scene, people);\n    let sel = N >= 10\n      ? selectClues(scene, people, pool, {\n          restarts: wantLogic ? 8 : 20, selCap: 9000,\n          timeBudgetMs: wantLogic ? 500 : 700, keepLogic: wantLogic })\n      : (N >= 8\n        ? selectClues(scene, people, pool, { restarts:8, selCap:16000, timeBudgetMs:1200, keepLogic: wantLogic })\n        : selectClues(scene, people, pool, { restarts:4, keepLogic: wantLogic }));\n    // se buscávamos lógica pura e não achamos pra este cenário, tenta uma\n    // versão qualquer (ainda única, só não garantidamente sem palpite) —\n    // só se ainda sobrar orçamento de tempo razoável, pra nunca estourar\n    // o prazo por causa desta tentativa extra\n    if (!sel && wantLogic && (deadline - Date.now()) > 1200){\n      sel = N >= 10\n        ? selectClues(scene, people, pool, { restarts:5, selCap:9000, timeBudgetMs:300, keepLogic:false })\n        : selectClues(scene, people, pool, { restarts:3, keepLogic:false });\n    }\n    if (!sel) continue;\n\n    const check = solve(scene, people, sel.clues);\n    if (check.count !== 1 || check.capped) continue; // unicidade PROVADA\n\n    const diff = difficulty(scene, people, sel.clues);\n    const victim = people.find(p => p.isVictim);\n    const vRoom = scene.roomOf[victim.cell[0]][victim.cell[1]];\n    const killer = people.find(p =>\n      !p.isVictim && scene.roomOf[p.cell[0]][p.cell[1]] === vRoom);\n\n    const c = {\n      seed, attempt, scene, people, clues: sel.clues,\n      solverCalls: sel.solverCalls, nodes: check.nodes,\n      diff, victim, killer,\n    };\n    const isLogic = diff.logicOnly;\n    if (wantDiff === \"any\") return c;\n    if (wantDiff === \"logic\" && isLogic) return c;\n    if (wantDiff === \"hard\" && !isLogic) return c;\n    fallback = fallback || c; // guarda o primeiro válido caso não ache o alvo\n  }\n  return fallback;\n}\n/*ENGINE-END*/\n<\u002Fscript>\n\n<script>\n/* ÍCONES SVG dos objetos */\nconst S = 'stroke=\"#2a2f3a\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"';\n\nconst ICONS = {\n/* -------- ocupáveis padrão -------- */\ncama: `<svg viewBox=\"0 0 64 64\">\n  <rect x=\"12\" y=\"4\" width=\"40\" height=\"56\" rx=\"6\" fill=\"#e8e3f5\" ${S}/>\n  <rect x=\"16\" y=\"8\" width=\"32\" height=\"14\" rx=\"5\" fill=\"#ffffff\" ${S}/>\n  <path d=\"M12 26 h40 v28 a6 6 0 0 1 -6 6 h-28 a6 6 0 0 1 -6 -6 z\" fill=\"#b9a7e0\" ${S}/>\n  <line x1=\"12\" y1=\"34\" x2=\"52\" y2=\"34\" stroke=\"#8f7cc0\" stroke-width=\"3\"/>\n<\u002Fsvg>`,\ncadeira: `<svg viewBox=\"0 0 64 64\">\n  <path d=\"M14 30 v-12 a8 8 0 0 1 8 -8 h20 a8 8 0 0 1 8 8 v12\" fill=\"#f3efe6\" ${S}/>\n  <rect x=\"6\"  y=\"24\" width=\"12\" height=\"26\" rx=\"6\" fill=\"#f3efe6\" ${S}/>\n  <rect x=\"46\" y=\"24\" width=\"12\" height=\"26\" rx=\"6\" fill= e\", 0.08); vibrate(15); },\n  uiClick(){ beep(700, 0.03, \"square\", 0.04); },\n  checkOk(){ playNotes([[520,.08,0,\"sine\",.1],[780,.1,.06,\"sine\",.1]]); vibrate(15); },\n  checkWrong(){ playNotes([[220,.12,0,\"sawtooth\",.1],[160,.16,.08,\"sawtooth\",.1]]); vibrate([40,40,40]); },\n  accuseWrong(){ playNotes([[300,.14,0,\"square\",.09],[220,.2,.1,\"square\",.09]]); vibrate([60,60,60,60]); },\n  victory(){\n    playNotes([[523,.14,0,\"sine\",.14],[659,.14,.13,\"sine\",.14],\n      [784,.14,.26,\"sine\",.14],[1047,.28,.39,\"sine\",.16]]);\n    vibrate([30,60,30,60,30,140]);\n  },\n};\nconst btnSoundEl = document.getElementById(\"btnSound\");\nbtnSoundEl.addEventListener(\"click\", () => {\n  soundOn = !soundOn;\n  btnSoundEl.textContent = soundOn ? \"🔊\" : \"🔇\";\n  if (soundOn){ ensureAudio(); beep(600, 0.05, \"sine\", 0.1); }\n});\n\n/* ============================================================\n   BUSTOS PROCEDURAIS — determinísticos por nome+gênero\n   (mesma pessoa = mesmo rosto em qualquer caso)\n============================================================ */\nconst AV_BG    = [\"#a34440\",\"#3f5d8a\",\"#3e7d5c\",\"#6d4f8a\",\"#b07a35\",\"#4a7d85\",\"#8a4a6b\"];\nconst AV_SKIN  = [\"#f2cba5\",\"#e6b98c\",\"#d1a06b\",\"#a8764a\",\"#7d5535\"];\nconst AV_HAIR  = [\"#2b2b2b\",\"#4a321e\",\"#7a4a24\",\"#b8862e\",\"#a33e2f\",\"#cfcfcf\"];\nconst AV_SHIRT = [\"#4a5262\",\"#7d5a9e\",\"#3f7d5a\",\"#b3554d\",\"#3a6ea5\",\"#c98a2e\",\"#5a5a4a\"];\nconst avatarCache = {};\n\nfunction avatarSVG(nome, genero){\n  const key = nome + \"|\" + genero;\n  if (avatarCache[key]) return avatarCache[key];\n  const t = personTraits(nome, genero); // MESMA fonte das pistas de traço\n  const bg = AV_BG[t.bg], skin = AV_SKIN[t.skin], shirt = AV_SHIRT[t.shirt];\n  const hair = AV_HAIR[t.hair];\n  const S2 = 'stroke=\"#20242e\" stroke-width=\"2.4\" stroke-linejoin=\"round\"';\n  const fem = genero === \"F\";\n  const style = t.style;\n  const hasGlasses = t.oculos;\n  const hasBeard
